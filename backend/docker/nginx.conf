# Workload isolation (wave M1, docs/OPERATIONS.md "PHP-FPM pullari"): three php-fpm pools, so a marketplace burst
# cannot take the workers the tills need.
#   critical  tills, KDS, customer display, staff board, terminal/PIN sign-in, payment webhooks, health checks
#   market    Mini App customer READS (stores, catalogue, own orders, notifications...): capped and rate limited
#   default   everything else: owner/partner panel, admin, every customer WRITE (checkout, cancel, login...)
# The pool sizes and the market limits come from the environment (backend/docker/pools.sh renders the two
# rizqim-pools-*.conf includes at container start; the image carries a copy rendered with the defaults).
# backend/tests/Feature/FpmPoolRoutingTest.php checks every registered route against the maps below: a new route
# prefix fails that test until it is assigned here.

include /etc/nginx/rizqim-pools-http.conf;

upstream fpm_critical { server 127.0.0.1:9001; }
upstream fpm_market   { server 127.0.0.1:9002; }
upstream fpm_default  { server 127.0.0.1:9000; }

# Step 1: the path's class. $rizqim_uri is $uri as the client asked for it (decoded, dot segments and repeated
# slashes resolved by nginx), captured in `location /` before try_files rewrites $uri to /index.php.
# Regexes are tried in order; the first match wins. A path no entry matches goes to the default pool.
map $rizqim_uri $rizqim_path_class {
    default                                                                  unassigned;

    # Health checks: Docker's healthcheck and uptime monitors must answer during a burst
    ~^/(up|health)$                                                          critical;
    ~^/api/v1/health$                                                        critical;
    # Tills, KDS, customer display, waiter app; the staff order board and the kitchen tickets
    ~^/api/v1/(pos|staff)(/|$)                                               critical;
    # Paired terminal: its own token, staff PIN sessions, pairing; token refresh (every app renews its session)
    ~^/api/v1/terminal(/|$)                                                  critical;
    ~^/api/v1/devices/pair$                                                  critical;
    ~^/api/v1/devices/[^/]+/staff-session$                                   critical;
    ~^/api/v1/auth/refresh$                                                  critical;
    # Payment providers' webhooks (Click, Payme): a paid order must be confirmed whatever else is going on
    ~^/api/v1/payments/(click|payme)/webhook$                                critical;

    # Shared by the till and the Mini App: decided by the query string in step 2
    ~^/api/v1/catalog$                                                       catalog;
    ~^/api/v1/catalog/availability$                                          availability;

    # Mini App customer screens: reads go to the market pool, writes to the default pool (step 2)
    ~^/api/v1/(stores|orders|notifications|delivery|addresses|locations|geocode|complaints)(/|$)  customer;

    # Owner/partner panel, admin, accounts, sign-in, bots, the rest of the API
    ~^/api/v1/(owner|admin)(/|$)                                             default;
    ~^/api/v1/(auth|user|me|features|phone|devices|couriers|reports|promo|store-applications|telegram)(/|$)  default;
    ~^/api/broadcasting/auth$                                                default;
    # Web routes outside the API (a redirect to the partner panel, API docs, local file links)
    ~^/(|docs/.*|_scramble/.*|sanctum/csrf-cookie|storage/.*)$               default;
}

# Step 2: the pool (= upstream name). Customer checkout and every other customer write go to the default pool, not
# the market one: they are a few per cent of the traffic, carry money and are idempotent (Idempotency-Key), so they
# are never capped or rate limited and never wait behind a browse burst; the default pool is not reachable by
# market reads. The till asks for the catalogue with channel=pos_hall|pos_takeaway and for the availability with a
# branch_id: those are the till's and go to the critical pool (a customer's request without them stays market).
map "$rizqim_path_class:$request_method:$arg_channel:$arg_branch_id" $rizqim_fpm {
    default                                                  fpm_default;
    ~^critical:                                              fpm_critical;
    ~^catalog:(GET|HEAD):pos_                                fpm_critical;
    ~^availability:(GET|HEAD):[^:]*:[0-9]                    fpm_critical;
    ~^(customer|catalog|availability):(GET|HEAD):            fpm_market;
}

# The market limits count only market requests (an empty key is not counted): per client (the Bearer token, or the
# client address when there is none) and the whole market pool of this container
map $rizqim_fpm $rizqim_market_client {
    default     "";
    fpm_market  $rizqim_client;
}
map $rizqim_fpm $rizqim_market_all {
    default     "";
    fpm_market  market;
}
map $http_authorization $rizqim_client {
    ""          $binary_remote_addr;
    default     $http_authorization;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # = post_max_size in backend/docker/php.ini: refuse (413) here what PHP would refuse anyway, without reading it in full.
    # API images are capped at 5 MB. Raise nginx and php.ini together.
    client_max_body_size 16m;

    # The client address for the per-client market limit ($remote_addr) behind the Mini App nginx or another private
    # proxy, read from X-Forwarded-For the same way Laravel's trustProxies does (bootstrap/app.php: the same ranges).
    # PHP still gets the connecting hop's address as REMOTE_ADDR (fastcgi_param below), so Laravel's own proxy trust
    # and its rate limits see exactly what they saw before.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    # Empty in the image; staging mounts a file with X-Robots-Tag noindex here (infra/staging/robots-header.conf)
    include /etc/nginx/rizqim-headers.conf;

    # $rizqim_uri is only set in `location /` (a request for /index.php itself has none: default pool)
    uninitialized_variable_warn off;

    location / {
        set $rizqim_uri $uri;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel would route /index.php/api/... like /api/...: refused, so no request reaches a pool its path does not name
    location ^~ /index.php/ {
        return 404;
    }

    location ~ \.php$ {
        # Market limits (zones in rizqim-pools-http.conf): a full market pool answers 503 at once instead of queueing,
        # a client above its rate gets 429; both with Retry-After. Never applied to the critical or default pool.
        include /etc/nginx/rizqim-pools-limits.conf;
        error_page 503 @rizqim_busy;
        error_page 429 @rizqim_rate_limited;

        fastcgi_pass $rizqim_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # The connecting hop, not the real_ip result above (php-fpm keeps the last value of a repeated parameter)
        fastcgi_param REMOTE_ADDR $realip_remote_addr;
        fastcgi_read_timeout 300;
    }

    # Answers of the market limits (nginx's own, never PHP's: fastcgi_intercept_errors is off). The Mini App shows
    # `message` and retries reads with a back-off.
    location @rizqim_busy {
        default_type application/json;
        add_header Retry-After $rizqim_retry_after always;
        add_header Cache-Control "no-store" always;
        return 503 '{"success":false,"message":"Hozir so\'rovlar juda ko\'p. Bir necha soniyadan keyin qayta urinib ko\'ring.","error":"server_busy"}';
    }
    location @rizqim_rate_limited {
        default_type application/json;
        add_header Retry-After $rizqim_retry_after always;
        add_header Cache-Control "no-store" always;
        return 429 '{"success":false,"message":"So\'rovlar juda tez yuborilyapti. Bir necha soniyadan keyin qayta urinib ko\'ring.","error":"too_many_requests"}';
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
