# Workload isolation (wave M1, docs/OPERATIONS.md "PHP-FPM pullari"): three php-fpm pools, so a marketplace burst
# cannot take the workers the tills need.
#   critical  tills, KDS, customer display, staff board, terminal/PIN sign-in, payment webhooks, health checks
#   market    Mini App customer READS (stores, catalogue, own orders, notifications...): capped and rate limited
#   default   everything else: owner/partner panel, admin, every customer WRITE (checkout, cancel, login...) and the
#             reads checkout waits for (delivery quote, pickup slots, the cart's store)
# The pool sizes and the market limits come from the environment (backend/docker/pools.sh renders the two
# rizqim-pools-*.conf includes at container start; the image carries a copy rendered with the defaults).
# backend/tests/Feature/FpmPoolRoutingTest.php checks every registered route against the maps below: a new route
# prefix fails that test until it is assigned here.

include /etc/nginx/rizqim-pools-http.conf;

upstream fpm_critical { server 127.0.0.1:9001; }
upstream fpm_market   { server 127.0.0.1:9002; }
upstream fpm_default  { server 127.0.0.1:9000; }

# Step 1: the path's class. $rizqim_uri is $uri as the client asked for it (decoded, dot segments and repeated
# slashes resolved by nginx), captured in `location /` before try_files rewrites $uri to /index.php.
# Regexes are tried in order; the first match wins. A path no entry matches goes to the default pool.
map $rizqim_uri $rizqim_path_class {
    default                                                                  unassigned;

    # Health checks: Docker's healthcheck and uptime monitors must answer during a burst
    ~^/(up|health)$                                                          critical;
    ~^/api/v1/health$                                                        critical;
    # Tills, KDS, customer display, waiter app; the staff order board and the kitchen tickets
    ~^/api/v1/(pos|staff)(/|$)                                               critical;
    # Paired terminal: its own token, staff PIN sessions, pairing; token refresh (every app renews its session)
    ~^/api/v1/terminal(/|$)                                                  critical;
    ~^/api/v1/devices/pair$                                                  critical;
    ~^/api/v1/devices/[^/]+/staff-session$                                   critical;
    ~^/api/v1/auth/refresh$                                                  critical;
    # Payment providers' webhooks (Click, Payme): a paid order must be confirmed whatever else is going on
    ~^/api/v1/payments/(click|payme|paylov)/webhook$                         critical;

    # Shared by the till and the Mini App: decided by the query string and the caller in step 2
    ~^/api/v1/catalog$                                                       catalog;
    ~^/api/v1/catalog/availability$                                          availability;

    # Reads the Mini App's checkout cannot go on without (the delivery price and minimum, the pickup times): the
    # default pool, with the order itself, so a market burst never stops an order (docs/OPERATIONS.md §14)
    ~^/api/v1/delivery/quote$                                                checkout;
    ~^/api/v1/stores/[^/]+/branches/[^/]+/pickup-slots$                      checkout;

    # Mini App customer screens: reads go to the market pool, writes to the default pool (step 2)
    ~^/api/v1/(stores|orders|notifications|delivery|addresses|locations|geocode|complaints)(/|$)  customer;

    # Owner/partner panel, admin, accounts, sign-in, bots, the rest of the API
    ~^/api/v1/(owner|admin)(/|$)                                             default;
    ~^/api/v1/(auth|user|me|features|phone|devices|couriers|reports|promo|store-applications|telegram)(/|$)  default;
    # Wave P step 2: the Mini App's analytics batches (a POST with a body: the market location refuses bodies). One
    # INSERT, limited per user, session and address in Laravel (App\Domain\Analytics\AnalyticsLimits)
    ~^/api/v1/analytics/events$                                              default;
    ~^/api/broadcasting/auth$                                                default;
    # M2: real-time status and connection settings (read on app start and reconnect; no database)
    ~^/api/v1/realtime$                                                      default;
    # Web routes outside the API (a redirect to the partner panel, API docs, local file links)
    ~^/(|docs/.*|_scramble/.*|sanctum/csrf-cookie|storage/.*)$               default;
}

# Step 2a: what the query string says about a shared path, on the raw $args (PHP reads the same bytes: a repeated
# parameter, another letter case or an encoded name can never make nginx and PHP see different requests here).
#   till      exactly the till's own form (backend pos_data catalog_repository, kitchen_setup): one channel=pos_hall|
#             pos_takeaway, else only branch_id / store_id with digits; availability: one branch_id with digits
#   staff     anything else that names a POS channel or a branch, in any letter case: the default pool (never a
#             limit for a till or a staff screen that sends something unexpected, never the critical pool)
#   checkout  the cart's own store list (Mini App Cart.tsx: branches for pickup, payment methods, order lock)
map "$rizqim_path_class?$args" $rizqim_query_class {
    default                                                                                         "";
    "~^catalog\?(?:(?:branch_id|store_id)(?:=[0-9]*)?&)*channel=pos_(?:hall|takeaway)(?:&(?:branch_id|store_id)(?:=[0-9]*)?)*$"  till;
    "~^availability\?(?:store_id=[0-9]*&)*branch_id=[0-9]+(?:&store_id=[0-9]*)*$"                  till;
    "~*^(?:catalog|availability)\?.*(?:pos|branch)"                                                 staff;
    "~^customer\?(?:.*&)?for=checkout(?:&|$)"                                                       checkout;
}

# Step 2b: the caller says it is a POS app (X-Rizqim-App, sent by every POS app: packages/dart/rizqim_api
# RizqimClient) and sends a Sanctum token (`id|secret`). The Mini App sends no such header. The token itself is checked
# by Laravel: this only decides where the request waits, a forged header buys a 401/403 in the critical pool, the same
# as any request to /api/v1/pos/*.
map "$http_x_rizqim_app:$http_authorization" $rizqim_pos_device {
    default                                                  "";
    "~^(?:cashier|waiter|kds|customer_display):Bearer\s+[0-9]{1,19}\|\S+$"  1;
}

# Step 2c: the pool (= upstream name). Customer checkout and every other customer write go to the default pool, not
# the market one: they are a few per cent of the traffic, carry money and are idempotent (Idempotency-Key), so they
# are never capped or rate limited and never wait behind a browse burst; the default pool is not reachable by
# market reads. A shared path goes to the critical pool only for a POS app's request in the till's exact form.
# The method is the one Laravel serves: bootstrap/app.php refuses a method override to GET/HEAD.
map "$rizqim_path_class:$request_method:$rizqim_query_class:$rizqim_pos_device" $rizqim_fpm {
    default                                                  fpm_default;
    ~^critical:                                              fpm_critical;
    ~^(catalog|availability):(GET|HEAD):till:1$              fpm_critical;
    ~^(customer|catalog|availability):(GET|HEAD)::           fpm_market;
}

# The market limits count only market requests (an empty key is not counted). Per client: the client address plus
# the Sanctum token id (the digits before `|`, never the secret), so customers behind one NAT have their own buckets
# and a made-up token gets a new bucket only within the per-address limits below. Per address: $binary_remote_addr
# (after real_ip). The whole market pool of this container: one key.
map $http_authorization $rizqim_token_id {
    default                                                  "";
    "~^Bearer\s+(?<rizqim_tid>[0-9]{1,19})\|"                t$rizqim_tid;
}
map $rizqim_fpm $rizqim_market_client {
    default     "";
    fpm_market  $binary_remote_addr$rizqim_token_id;
}
map $rizqim_fpm $rizqim_market_ip {
    default     "";
    fpm_market  $binary_remote_addr;
}
map $rizqim_fpm $rizqim_market_all {
    default     "";
    fpm_market  market;
}

# A request that announces a body ("Content-Length:Transfer-Encoding"): a market GET never has one, and one that
# does would hold a market slot while nginx waits for the body (M1 review R2-1), so it is refused first
map "$http_content_length:$http_transfer_encoding" $rizqim_has_body {
    default     1;
    "~^0*:$"    0;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # = post_max_size in backend/docker/php.ini: refuse (413) here what PHP would refuse anyway, without reading it in full.
    # API images are capped at 5 MB. Raise nginx and php.ini together.
    client_max_body_size 16m;

    # client_header_timeout stays nginx's default (60 s, a till on a poor link): headers are read before any market
    # slot is taken, so a slow header holds no market capacity.

    # The client address for the per-client market limit ($remote_addr) behind the Mini App nginx or another private
    # proxy, read from X-Forwarded-For the same way Laravel's trustProxies does (bootstrap/app.php: the same ranges).
    # PHP still gets the connecting hop's address as REMOTE_ADDR (fastcgi_param below), so Laravel's own proxy trust
    # and its rate limits see exactly what they saw before.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    # Empty in the image; staging mounts a file with X-Robots-Tag noindex here (infra/staging/robots-header.conf)
    include /etc/nginx/rizqim-headers.conf;

    # $rizqim_uri is only set in `location /` (a request for /index.php itself has none: default pool)
    uninitialized_variable_warn off;

    location / {
        set $rizqim_uri $uri;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel would route /index.php/api/... like /api/...: refused, so no request reaches a pool its path does not name
    location ^~ /index.php/ {
        return 404;
    }

    location ~ \.php$ {
        # Market requests continue in @rizqim_market (its limits and timeouts); the critical and default pools never
        # pass through a limit. recursive_error_pages: the limits' own 503/429 pages there are a second redirect.
        recursive_error_pages on;
        error_page 418 = @rizqim_market;
        if ($rizqim_fpm = fpm_market) {
            return 418;
        }

        fastcgi_pass $rizqim_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # The connecting hop, not the real_ip result above (php-fpm keeps the last value of a repeated parameter)
        fastcgi_param REMOTE_ADDR $realip_remote_addr;
        fastcgi_read_timeout 300;
    }

    # Mini App customer reads (step 2c). Before any limit is counted (rewrite phase): a GET with a body is refused.
    # Then the limits (zones in rizqim-pools-http.conf): a full market pool, or a client/address above its share of
    # it, answers 503 at once instead of queueing; a client/address above its rate gets 429; both with Retry-After.
    # The timeouts are short so a slow client cannot keep a slot: no body is read, a response nobody reads is dropped
    # after send_timeout, and a stuck PHP request frees its slot after fastcgi_read_timeout.
    location @rizqim_market {
        if ($rizqim_has_body) {
            return 400 '{"success":false,"message":"Bu so\'rov tanasiz yuborilishi kerak.","error":"unexpected_body"}';
        }
        include /etc/nginx/rizqim-pools-limits.conf;
        recursive_error_pages on;
        error_page 503 @rizqim_busy;
        error_page 429 @rizqim_rate_limited;
        client_body_timeout 5s;
        send_timeout 10s;

        fastcgi_pass fpm_market;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param REMOTE_ADDR $realip_remote_addr;
        fastcgi_read_timeout 60s;
    }

    # Answers of the market limits (nginx's own, never PHP's: fastcgi_intercept_errors is off). The Mini App shows
    # `message` and retries reads after Retry-After.
    location @rizqim_busy {
        default_type application/json;
        add_header Retry-After $rizqim_retry_after always;
        add_header Cache-Control "no-store" always;
        return 503 '{"success":false,"message":"Hozir so\'rovlar juda ko\'p. Bir necha soniyadan keyin qayta urinib ko\'ring.","error":"server_busy"}';
    }
    location @rizqim_rate_limited {
        default_type application/json;
        add_header Retry-After $rizqim_retry_after always;
        add_header Cache-Control "no-store" always;
        return 429 '{"success":false,"message":"So\'rovlar juda tez yuborilyapti. Bir necha soniyadan keyin qayta urinib ko\'ring.","error":"too_many_requests"}';
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
