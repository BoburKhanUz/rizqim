server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # = post_max_size in backend/docker/php.ini: refuse (413) here what PHP would refuse anyway, without reading it in full.
    # Panel (Filament/Livewire) uploads are capped at 12 MB, API images at 5 MB. Raise nginx and php.ini together.
    client_max_body_size 16m;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
