[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

; Both go through pools.sh: it sets the pool sizes and market limits from the environment (defaults when unset), checks
; them and renders nginx's rizqim-pools-*.conf includes; docs/OPERATIONS.md "PHP-FPM pullari"
[program:php-fpm]
command=/usr/local/bin/rizqim-pools php-fpm
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/local/bin/rizqim-pools nginx
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
