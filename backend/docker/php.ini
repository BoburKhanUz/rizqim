; Loaded by backend/Dockerfile as conf.d/zz-rizqim.ini, so it applies to php-fpm and to the CLI.
;
; Upload limits. PHP's own defaults (2M per file, 8M per request) rejected every photo above 2 MB even though both
; nginx layers allowed more. Chain, from the browser inwards:
;   Mini App nginx client_max_body_size 10m (customer/miniapp/docker/nginx.conf, the API caps an image at 5 MB)
;   -> backend nginx client_max_body_size 16m (backend/docker/nginx.conf, = post_max_size)
;   -> post_max_size 16M >= upload_max_filesize 12M (headroom: the API itself caps an image at 5 MB).
; Raise all of them together.
upload_max_filesize = 12M
post_max_size = 16M

; OPcache for php-fpm (M2-4). The image's defaults were PHP's own: 128 MB, 10 000 files, 8 MB interned strings and a
; file stat every 2 s (validate_timestamps=1). The code is baked into the image and never changes while the container
; runs (every artisan cache file is written by entrypoint.sh before php-fpm starts), so the timestamps are not checked:
; a deploy is a new container. Mounting the source into a container (local development) needs
; PHP_OPCACHE_VALIDATE_TIMESTAMPS=1, or edits are not seen until php-fpm restarts. The CLI (queue, scheduler, artisan)
; keeps opcache off (opcache.enable_cli is not set): a new process per command gains nothing from it.
; Measured on the scale-test kit: docs/scale/PHP_COST_M2.md.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 32531
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-0}
opcache.revalidate_freq = 2
; Framework and app code use attributes and docblocks at runtime (Scramble, validation attributes): keep comments
opcache.save_comments = 1
; Preload (docker/preload.php): the ~1 300 classes a request uses are declared once when php-fpm starts, not per request.
; PHP_PRELOAD=0 turns it off (the script then returns at once); it is also off while validate_timestamps is on. The
; path and user only change outside the image (scripts/scale-test/server.sh sets both).
opcache.preload = ${PHP_OPCACHE_PRELOAD:-/var/www/html/docker/preload.php}
opcache.preload_user = ${PHP_OPCACHE_PRELOAD_USER:-www-data}
; JIT stays off by default (measured only -4 % CPU per request here, and the tracing JIT is the least proven part of
; PHP 8.3); PHP_OPCACHE_JIT_BUFFER_SIZE=64M turns it on for a trial on staging.
opcache.jit = tracing
opcache.jit_buffer_size = ${PHP_OPCACHE_JIT_BUFFER_SIZE:-0}
; Every request resolves the same ~1 000 include paths: cache them for longer than the 120 s default
realpath_cache_size = 4096K
realpath_cache_ttl = 600
