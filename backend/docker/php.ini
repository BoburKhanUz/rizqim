; Loaded by backend/Dockerfile as conf.d/zz-rizqim.ini, so it applies to php-fpm and to the CLI.
;
; Upload limits. PHP's own defaults (2M per file, 8M per request) rejected every photo above 2 MB even though both
; nginx layers allowed more. Chain, from the browser inwards:
;   Mini App nginx client_max_body_size 10m (customer/miniapp/docker/nginx.conf, the API caps an image at 5 MB)
;   -> backend nginx client_max_body_size 16m (backend/docker/nginx.conf, = post_max_size)
;   -> post_max_size 16M >= upload_max_filesize 12M (12 MB is Livewire's own limit for Filament panel uploads).
; Raise all of them together.
upload_max_filesize = 12M
post_max_size = 16M
