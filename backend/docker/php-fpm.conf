; php-fpm pools of the backend image (wave M1 workload isolation; docs/OPERATIONS.md "PHP-FPM pullari").
; Installed by backend/Dockerfile as /usr/local/etc/php-fpm.d/rizqim.conf in place of the base image's www pool.
; nginx (backend/docker/nginx.conf) picks the pool by the request path. The ${...} values come from the environment:
; backend/docker/pools.sh sets the defaults before it starts php-fpm, so an unset variable is never empty here.
;
;   critical  static: its workers are always running, a till never waits for a fork
;   market    ondemand, capped; nice'd so its CPU yields to the tills; a short listen queue (nginx also caps
;             in-flight market requests at NGINX_MARKET_MAX_INFLIGHT and answers 503 above that)
;   default   ondemand
;   analytics ondemand, small (FPM_ANALYTICS_CHILDREN, 2), nice'd below the market, a short listen queue: only
;             POST /api/v1/analytics/events (its own nginx location: 32 KB body cap, limits, short timeouts), so a
;             flood of analytics batches can never take a worker of the default pool, where checkout runs. A batch
;             refused there (503) is lost or retried by the app: acceptable, slowing checkout is not
; Every pool keeps the container's environment (clear_env = no): Laravel reads its settings from it.

[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[critical]
user = www-data
group = www-data
listen = 127.0.0.1:9001
listen.backlog = 511
pm = static
pm.max_children = ${FPM_CRITICAL_CHILDREN}
pm.max_requests = ${FPM_MAX_REQUESTS}
process.priority = 0
clear_env = no
access.log = /proc/self/fd/2
access.format = "%n %R - %u %t \"%m %{REQUEST_URI}e\" %s %{mili}d ms"
catch_workers_output = yes
decorate_workers_output = no

[market]
user = www-data
group = www-data
listen = 127.0.0.1:9002
listen.backlog = ${FPM_MARKET_BACKLOG}
pm = ondemand
pm.max_children = ${FPM_MARKET_CHILDREN}
pm.process_idle_timeout = 30s
pm.max_requests = ${FPM_MAX_REQUESTS}
process.priority = ${FPM_MARKET_PRIORITY}
clear_env = no
access.log = /proc/self/fd/2
access.format = "%n %R - %u %t \"%m %{REQUEST_URI}e\" %s %{mili}d ms"
catch_workers_output = yes
decorate_workers_output = no

[default]
user = www-data
group = www-data
listen = 127.0.0.1:9000
listen.backlog = 511
pm = ondemand
pm.max_children = ${FPM_DEFAULT_CHILDREN}
pm.process_idle_timeout = 30s
pm.max_requests = ${FPM_MAX_REQUESTS}
process.priority = ${FPM_DEFAULT_PRIORITY}
clear_env = no
access.log = /proc/self/fd/2
access.format = "%n %R - %u %t \"%m %{REQUEST_URI}e\" %s %{mili}d ms"
catch_workers_output = yes
decorate_workers_output = no

[analytics]
user = www-data
group = www-data
listen = 127.0.0.1:9003
listen.backlog = ${FPM_ANALYTICS_BACKLOG}
pm = ondemand
pm.max_children = ${FPM_ANALYTICS_CHILDREN}
pm.process_idle_timeout = 30s
pm.max_requests = ${FPM_MAX_REQUESTS}
process.priority = ${FPM_ANALYTICS_PRIORITY}
clear_env = no
access.log = /proc/self/fd/2
access.format = "%n %R - %u %t \"%m %{REQUEST_URI}e\" %s %{mili}d ms"
catch_workers_output = yes
decorate_workers_output = no
