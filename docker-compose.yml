# Rizqim: postgres + redis + backend (nginx/php-fpm) + queue + queue-reports + scheduler + reverb (WebSocket) + frontend (nginx)
# + partner-web (hamkor veb-panel, Next.js).
# Ishga tushirish va yangilash: docker compose up -d --build
# Monitoring: GET /health (JSON), loglar JSON/stderr'da, zaxira `backup` xizmatida: docs/OPERATIONS.md.
# Deploy qadamlari (migratsiya, app:check-production, telegram:set-webhook, queue:restart) backend/docker/entrypoint.sh da;
# artisan va navbat/scheduler jarayonlari www-data nomidan ishlaydi (entrypoint su-exec bilan tushiradi).
# Ops buyruqlari: docker compose exec -u www-data backend php artisan ... (exec standart bo'yicha root: root yaratgan
# storage/logs/laravel.log ni php-fpm yoza olmaydi).

# Backend, queue va scheduler bitta Dockerfile va bitta kod bazasidan quriladi; sozlamalar backend/.env dan (env_file) olinadi.
x-backend: &backend
  build:
    context: ./backend
  restart: unless-stopped
  env_file:
    - ./backend/.env
  volumes:
    - backend_storage:/var/www/html/storage/app

# Docker tarmog'iga xos qiymatlar (environment env_file dan ustun): backend/.env dagi 127.0.0.1 o'rniga xizmat nomlari.
# Kesh, navbat, sessiya va rate-limit drayverlari (CACHE_STORE, QUEUE_CONNECTION, SESSION_DRIVER) backend/.env da;
# ular redis bo'lsa, shu REDIS_* qiymatlari ishlatiladi. REDIS_PASSWORD ildiz .env dan olinadi (redis xizmati bilan bir xil).
x-backend-environment: &backend-environment
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-rizqimbot}
  DB_USERNAME: ${DB_USERNAME:-rizqimbot}
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  # Real-time updates (Laravel Reverb, `reverb` xizmati). Kalitlar ildiz .env dan (frontend build ham shu REVERB_APP_KEY
  # ni oladi), shuning uchun backend/.env dagi REVERB_APP_* va BROADCAST_CONNECTION Docker'da e'tiborga olinmaydi.
  # Backend Reverb'ga compose tarmog'i ichida HTTP orqali (reverb:8080) yozadi; brauzerlar esa Mini App origin'i orqali
  # (frontend nginx faqat /app/ ni reverb:8080 ga proksi qiladi). Standart null (o'chiq; qolgan hammasi odatdagidek
  # ishlaydi, Mini App so'rov bilan yangilaydi): bo'sh kalitlar bilan private kanal imzosini istalgan kishi soxtalashtira
  # oladi. Kalitlarni yaratgach ildiz .env da BROADCAST_CONNECTION=reverb qiling; reverb + bo'sh kalit bo'lsa
  # app:check-production konteynerni ishga tushirmaydi. docs/DEPLOY.md (9-bo'lim), docs/OPERATIONS.md
  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-null}
  REVERB_APP_ID: ${REVERB_APP_ID:-}
  REVERB_APP_KEY: ${REVERB_APP_KEY:-}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-*}

# Ikkala navbat ishchisi uchun umumiy qism: backend sog'lom bo'lgach (migratsiyalar tugagach) ishga tushadi.
# SIGTERM'da ishchi joriy jobni tugatib chiqadi; eng uzun job (SendOrderReport) 120 s, shuning uchun standart 10 s emas.
x-queue-worker: &queue-worker
  <<: *backend
  environment:
    <<: *backend-environment
    RUN_MIGRATIONS: "false"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    backend:
      condition: service_healthy
  stop_grace_period: 150s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-rizqimbot}
      POSTGRES_USER: ${DB_USERNAME:-rizqimbot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rizqimbot} -d ${DB_DATABASE:-rizqimbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kesh, navbat (queue), sessiya va rate-limit shu yerda. Tashqariga port ochilmagan (faqat compose tarmog'i).
  # --appendonly: navbatdagi joblar Redis qayta ishga tushganda yo'qolmasin.
  # maxmemory-policy ni allkeys-*/volatile-* qilmang: Redis navbat va sessiya kalitlarini ham o'chirib yuboradi.
  # --requirepass "" parolsiz degani; REDIS_PASSWORD to'ldirilsa Redis va barcha backend xizmatlari shu parolni ishlatadi.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\" --no-auth-warning} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Veb-konteyner: deploy qadamlarini shu bajaradi (RUN_MIGRATIONS=true), shuning uchun healthcheck migratsiyalar
  # tugab nginx ishga tushgandan keyingina o'tadi; queue, scheduler va frontend shuni kutadi.
  backend:
    <<: *backend
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS: "true"
    ports:
      - "${BACKEND_PORT:-8000}:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # /health (GET, JSON): bazaga va Redis'ga haqiqatan ulanishni tekshiradi, shuning uchun /up (faqat "ilova ishga tushdi")
    # dan aniqroq. Ular ishlamasa 503 qaytaradi (wget xato kodi bilan chiqadi). Scheduler yoki navbat muammosi 200 (degraded)
    # beradi, shuning uchun u backend'ni nosog'lom qilmaydi (scheduler/queue shu healthcheck'ni kutadi). docs/OPERATIONS.md
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s

  # Navbat ishchilari QUEUE_CONNECTION ga ergashadi (redis; 'database' zaxira). Ikki ishchi: og'ir hisobotlar (SendOrderReport, `reports` navbati)
  # Telegram xabarlari (`default` navbati) ortidan navbat kutib qolmasin va xotira cheklovi bilan ajratilgan bo'lsin.
  # `broadcasts` (Reverb real-time eventlari, bir urinish) shu ishchida, `default` dan keyin: Reverb ishlamay qolsa ham
  # Telegram joblari oldinda turadi. queue:restart (entrypoint) ikkalasini ham yangilaydi.
  queue:
    <<: *queue-worker
    command: ["php", "artisan", "queue:work", "--queue=default,broadcasts", "--tries=3", "--max-time=3600"]

  # `reports` navbati: SendOrderReport (CSV hisobot, job timeout 120 s). --memory=512 ishchining yumshoq chegarasi
  # (job tugagach chiqadi), -d memory_limit=768M esa PHP'ning qattiq chegarasi (standart 128M bo'lsa --memory ma'nosiz).
  queue-reports:
    <<: *queue-worker
    command: ["php", "-d", "memory_limit=768M", "artisan", "queue:work", "--queue=reports", "--memory=512", "--timeout=150", "--tries=1", "--max-time=3600"]

  # To'lanmagan onlayn buyurtmalarni bekor qilish kabi rejalashtirilgan vazifalar uchun.
  scheduler:
    <<: *backend
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]
    # Har daqiqada kesh'ga yoziladigan yurak urishi (health-heartbeat) 3 daqiqadan eskirsa yoki yo'q bo'lsa nosog'lom.
    # Healthcheck root nomidan ishlaydi: artisan www-data nomidan chaqiriladi (aks holda storage/logs root'niki bo'lib qoladi).
    healthcheck:
      test: ["CMD-SHELL", "su-exec www-data php artisan health:scheduler || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 180s

  # WebSocket server (Laravel Reverb): buyurtma holatlari Mini App'ga real vaqtda (routes/channels.php dagi private
  # kanallar, POST /api/broadcasting/auth). Tashqariga port ochilmagan: brauzer frontend nginx orqali (/app/)
  # ulanadi, backend/queue esa compose tarmog'ida reverb:8080 ga yozadi. Eventlar `broadcasts` navbati orqali yuboriladi (`queue`).
  # Yangi kod `docker compose up -d --build` da qayta yaratish bilan keladi. docs/DEPLOY.md
  reverb:
    <<: *backend
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    expose:
      - "8080"
    # Har WebSocket ulanishi bitta fayl deskriptori: konteynerning standart cheklovi (Docker'ga qarab 1024 bo'lishi mumkin)
    # ko'p ulanishda "Too many open files" beradi. Event loop ext-uv (backend/Dockerfile) bilan stream_select ning ~1000
    # ulanish chegarasi yo'q, shuning uchun nofile ni aniq oshiramiz. docs/OPERATIONS.md, 6-bo'lim
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Reverb'ning o'z GET /up yo'li (server ishlayapti va so'rovlarga javob beryapti)
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      # Ildiz: Mini App umumiy packages/ts/ui paketiga bog'liq (P1-25). Image'ga nimalar kirishi: customer/miniapp/Dockerfile.dockerignore
      context: .
      dockerfile: customer/miniapp/Dockerfile
      args:
        VITE_BOT_USERNAME: ${VITE_BOT_USERNAME:-rizqimbot}
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:-}
        VITE_MAP_ATTRIBUTION: ${VITE_MAP_ATTRIBUTION:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-production}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0}
        # Reverb (WebSocket) ulanishi: kalit backend bilan bir xil (ildiz .env dagi REVERB_APP_KEY). Bo'sh host =
        # Mini App ochilgan domen (window.location.hostname); port/scheme tashqi HTTPS proksi bo'yicha (443/https)
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-${REVERB_APP_KEY:-}}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    # Mini App nginx orqali backend'gacha butun zanjir (nginx -> /api/ proksi -> backend -> baza/Redis) ishlayaptimi
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Hamkor veb-panel (partner/web, Next.js; restoran egasi va xodimlari, SMS kod bilan kiradi). Tashqi TLS proksi uni
  # alohida hostda beradi: panel.<domen> -> PARTNER_WEB_PORT (Mini App FRONTEND_PORT da bo'lgani kabi). Sozlamalar
  # runtime'da o'qiladi (image har muhitda bir xil): Next serveri backend'ga compose tarmog'i ichida (API_BASE_URL),
  # brauzer esa API'ga ochiq manzil orqali (PARTNER_PUBLIC_API_BASE_URL, masalan https://<domen>/api) murojaat qiladi,
  # shuning uchun backend/.env dagi CORS_ALLOWED_ORIGINS da panel origin'i (https://panel.<domen>) bo'lishi shart.
  # docs/DEPLOY.md (4-bo'lim), partner/web/README.md
  partner-web:
    build:
      # Ildiz: panel packages/ts/ui va packages/ts/api-client ga bog'liq. Image'ga nimalar kirishi: partner/web/Dockerfile.dockerignore
      context: .
      dockerfile: partner/web/Dockerfile
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend/api
      PUBLIC_API_BASE_URL: ${PARTNER_PUBLIC_API_BASE_URL:-}
      # Sessiya cookie'lari faqat HTTPS orqali (production). false faqat http:// orqali sinash uchun
      SESSION_COOKIE_SECURE: ${PARTNER_SESSION_COOKIE_SECURE:-true}
    depends_on:
      backend:
        condition: service_healthy
    # Faqat 127.0.0.1 da: panel kirish so'rovlarini backend'ga mijozning IP manzili bilan (X-Forwarded-For) uzatadi va bu
    # manzilni tashqi proksi yozgan oxirgi yozuvdan oladi. Portga proksini chetlab kelgan kishi o'z IP'sini soxtalashtirib
    # SMS/kod limitlarini aylanib o'tardi. Proksi boshqa xostda bo'lsa PARTNER_WEB_BIND (port faqat proksiga ochiq bo'lsin).
    # docs/DEPLOY.md, 4-bo'lim
    ports:
      - "${PARTNER_WEB_BIND:-127.0.0.1}:${PARTNER_WEB_PORT:-3000}:3000"
    # Kirish sahifasi (Next serveri ishlayapti); backend'ga ulanishni frontend healthcheck'i tekshiradi
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # PostgreSQL zaxirasi: har kuni BACKUP_TIME (UTC) da pg_dump (custom format) -> BACKUP_HOST_DIR (standart ./backups),
  # BACKUP_RETENTION_DAYS kundan eskilari o'chiriladi. Ishga tushganda ham bitta zaxira oladi. Tashqi nusxa: BACKUP_OFFSITE_CMD
  # (ildizdagi .env.example) yoki BACKUP_S3_* (rclone, obraz infra/backup/Dockerfile). Tiklash: docker compose exec -it backup restore.sh /backups/<fayl>.dump <baza>. docs/OPERATIONS.md
  # Obraz postgres bilan bir xil versiya: pg_dump server versiyasidan eski bo'lmasligi shart.
  backup:
    # postgres:17-alpine + rclone (infra/backup/Dockerfile): BACKUP_S3_* berilsa har dump S3-mos xotiraga ham yuklanadi
    build:
      context: ./infra/backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${DB_USERNAME:-rizqimbot}
      PGPASSWORD: ${DB_PASSWORD:-secret}
      PGDATABASE: ${DB_DATABASE:-rizqimbot}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_OFFSITE_CMD: ${BACKUP_OFFSITE_CMD:-}
      # Server tashqarisiga nusxa (S3-mos: AWS S3, Cloudflare R2, Backblaze B2, MinIO). Bo'sh bo'lsa hech narsa qilinmaydi;
      # endpoint, bucket, kalit va maxfiy kalit to'rttasi ham kerak. scripts/backup.sh, docs/OPERATIONS.md, 4-bo'lim
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET: ${BACKUP_S3_SECRET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
      BACKUP_S3_RETENTION_DAYS: ${BACKUP_S3_RETENTION_DAYS:-}
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ./scripts/restore.sh:/usr/local/bin/restore.sh:ro
    command: ["sh", "/usr/local/bin/backup.sh", "--daemon"]

volumes:
  postgres_data:
  redis_data:
  backend_storage:
