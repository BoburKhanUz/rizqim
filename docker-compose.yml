# Rizqim: postgres + redis + backend (nginx/php-fpm) + queue + queue-reports + scheduler + frontend (nginx).
# Ishga tushirish va yangilash: docker compose up -d --build
# Monitoring: GET /health (JSON), loglar JSON/stderr'da, zaxira `backup` xizmatida: docs/OPERATIONS.md.
# Deploy qadamlari (migratsiya, app:check-production, telegram:set-webhook, queue:restart) backend/docker/entrypoint.sh da;
# artisan va navbat/scheduler jarayonlari www-data nomidan ishlaydi (entrypoint su-exec bilan tushiradi).
# Ops buyruqlari: docker compose exec -u www-data backend php artisan ... (exec standart bo'yicha root: root yaratgan
# storage/logs/laravel.log ni php-fpm yoza olmaydi).
# VPS varianti shu qadamlarni scripts/setup-server.sh va scripts/deploy.sh bilan bajaradi.

# Backend, queue va scheduler bitta Dockerfile va bitta kod bazasidan quriladi; sozlamalar backend/.env dan (env_file) olinadi.
x-backend: &backend
  build:
    context: ./backend
  restart: unless-stopped
  env_file:
    - ./backend/.env
  volumes:
    - backend_storage:/var/www/html/storage/app

# Docker tarmog'iga xos qiymatlar (environment env_file dan ustun): backend/.env dagi 127.0.0.1 o'rniga xizmat nomlari.
# Kesh, navbat, sessiya va rate-limit drayverlari (CACHE_STORE, QUEUE_CONNECTION, SESSION_DRIVER) backend/.env da;
# ular redis bo'lsa, shu REDIS_* qiymatlari ishlatiladi. REDIS_PASSWORD ildiz .env dan olinadi (redis xizmati bilan bir xil).
x-backend-environment: &backend-environment
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-rizqimbot}
  DB_USERNAME: ${DB_USERNAME:-rizqimbot}
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}

# Ikkala navbat ishchisi uchun umumiy qism: backend sog'lom bo'lgach (migratsiyalar tugagach) ishga tushadi.
# SIGTERM'da ishchi joriy jobni tugatib chiqadi; eng uzun job (SendOrderReport) 120 s, shuning uchun standart 10 s emas.
x-queue-worker: &queue-worker
  <<: *backend
  environment:
    <<: *backend-environment
    RUN_MIGRATIONS: "false"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    backend:
      condition: service_healthy
  stop_grace_period: 150s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-rizqimbot}
      POSTGRES_USER: ${DB_USERNAME:-rizqimbot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rizqimbot} -d ${DB_DATABASE:-rizqimbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kesh, navbat (queue), sessiya va rate-limit shu yerda. Tashqariga port ochilmagan (faqat compose tarmog'i).
  # --appendonly: navbatdagi joblar Redis qayta ishga tushganda yo'qolmasin.
  # maxmemory-policy ni allkeys-*/volatile-* qilmang: Redis navbat va sessiya kalitlarini ham o'chirib yuboradi.
  # --requirepass "" parolsiz degani; REDIS_PASSWORD to'ldirilsa Redis va barcha backend xizmatlari shu parolni ishlatadi.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\" --no-auth-warning} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Veb-konteyner: deploy qadamlarini shu bajaradi (RUN_MIGRATIONS=true), shuning uchun healthcheck migratsiyalar
  # tugab nginx ishga tushgandan keyingina o'tadi; queue, scheduler va frontend shuni kutadi.
  backend:
    <<: *backend
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS: "true"
    ports:
      - "${BACKEND_PORT:-8000}:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # /health (GET, JSON): bazaga va Redis'ga haqiqatan ulanishni tekshiradi, shuning uchun /up (faqat "ilova ishga tushdi")
    # dan aniqroq. Ular ishlamasa 503 qaytaradi (wget xato kodi bilan chiqadi). Scheduler yoki navbat muammosi 200 (degraded)
    # beradi, shuning uchun u backend'ni nosog'lom qilmaydi (scheduler/queue shu healthcheck'ni kutadi). docs/OPERATIONS.md
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s

  # Navbat ishchilari QUEUE_CONNECTION ga ergashadi (redis; 'database' zaxira). VPS: rizqim-queue.service va
  # rizqim-queue-reports.service, flaglar bir xil. Ikki ishchi: og'ir hisobotlar (SendOrderReport, `reports` navbati)
  # Telegram xabarlari (`default` navbati) ortidan navbat kutib qolmasin va xotira cheklovi bilan ajratilgan bo'lsin.
  # queue:restart (entrypoint) ikkalasini ham yangilaydi.
  queue:
    <<: *queue-worker
    command: ["php", "artisan", "queue:work", "--queue=default", "--tries=3", "--max-time=3600"]

  # `reports` navbati: SendOrderReport (CSV hisobot, job timeout 120 s). --memory=512 ishchining yumshoq chegarasi
  # (job tugagach chiqadi), -d memory_limit=768M esa PHP'ning qattiq chegarasi (standart 128M bo'lsa --memory ma'nosiz).
  queue-reports:
    <<: *queue-worker
    command: ["php", "-d", "memory_limit=768M", "artisan", "queue:work", "--queue=reports", "--memory=512", "--timeout=150", "--tries=1", "--max-time=3600"]

  # To'lanmagan onlayn buyurtmalarni bekor qilish kabi rejalashtirilgan vazifalar uchun. VPS: cron (schedule:run).
  scheduler:
    <<: *backend
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]
    # Har daqiqada kesh'ga yoziladigan yurak urishi (health-heartbeat) 3 daqiqadan eskirsa yoki yo'q bo'lsa nosog'lom.
    # Healthcheck root nomidan ishlaydi: artisan www-data nomidan chaqiriladi (aks holda storage/logs root'niki bo'lib qoladi).
    healthcheck:
      test: ["CMD-SHELL", "su-exec www-data php artisan health:scheduler || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 180s

  frontend:
    build:
      context: ./mini-app
      args:
        VITE_BOT_USERNAME: ${VITE_BOT_USERNAME:-rizqimbot}
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:-}
        VITE_MAP_ATTRIBUTION: ${VITE_MAP_ATTRIBUTION:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-production}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    # Mini App nginx orqali backend'gacha butun zanjir (nginx -> /api/ proksi -> backend -> baza/Redis) ishlayaptimi
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # PostgreSQL zaxirasi: har kuni BACKUP_TIME (UTC) da pg_dump (custom format) -> BACKUP_HOST_DIR (standart ./backups),
  # BACKUP_RETENTION_DAYS kundan eskilari o'chiriladi. Ishga tushganda ham bitta zaxira oladi. Tashqi nusxa: BACKUP_OFFSITE_CMD
  # (ildizdagi .env.example). Tiklash: docker compose exec -it backup restore.sh /backups/<fayl>.dump <baza>. docs/OPERATIONS.md
  # Obraz postgres bilan bir xil versiya: pg_dump server versiyasidan eski bo'lmasligi shart.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${DB_USERNAME:-rizqimbot}
      PGPASSWORD: ${DB_PASSWORD:-secret}
      PGDATABASE: ${DB_DATABASE:-rizqimbot}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_OFFSITE_CMD: ${BACKUP_OFFSITE_CMD:-}
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ./scripts/restore.sh:/usr/local/bin/restore.sh:ro
    command: ["sh", "/usr/local/bin/backup.sh", "--daemon"]

volumes:
  postgres_data:
  redis_data:
  backend_storage:
