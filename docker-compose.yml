# Rizqim: postgres + pgbouncer + redis + backend (nginx/php-fpm) + queue + queue-reports + scheduler + reverb (WebSocket) + frontend (nginx)
# + partner-web (hamkor veb-panel, Next.js) + platform-admin (RIZQIM boshqaruv markazi, Next.js).
# Ishga tushirish va yangilash: docker compose up -d --build
# Monitoring: GET /health (JSON), loglar JSON/stderr'da, zaxira `backup` xizmatida: docs/OPERATIONS.md.
# Deploy qadamlari (migratsiya, app:check-production, telegram:set-webhook, queue:restart) backend/docker/entrypoint.sh da;
# artisan va navbat/scheduler jarayonlari www-data nomidan ishlaydi (entrypoint su-exec bilan tushiradi).
# Ops buyruqlari: docker compose exec -u www-data backend php artisan ... (exec standart bo'yicha root: root yaratgan
# storage/logs/laravel.log ni php-fpm yoza olmaydi).

# Backend, queue va scheduler bitta Dockerfile va bitta kod bazasidan quriladi; sozlamalar backend/.env dan (env_file) olinadi.
x-backend: &backend
  build:
    context: ./backend
  restart: unless-stopped
  env_file:
    - ./backend/.env
  volumes:
    - backend_storage:/var/www/html/storage/app

# Docker tarmog'iga xos qiymatlar (environment env_file dan ustun): backend/.env dagi 127.0.0.1 o'rniga xizmat nomlari.
# Kesh, navbat, sessiya va rate-limit drayverlari (CACHE_STORE, QUEUE_CONNECTION, SESSION_DRIVER) backend/.env da;
# ular redis bo'lsa, shu REDIS_* qiymatlari ishlatiladi. REDIS_PASSWORD ildiz .env dan olinadi (redis xizmati bilan bir xil).
x-backend-environment: &backend-environment
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-rizqimbot}
  DB_USERNAME: ${DB_USERNAME:-rizqimbot}
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  # Bazaga ulanishlar puli (PgBouncer, tranzaksiya rejimi): faqat `backend` (php-fpm) pul orqali ishlaydi, u yerda
  # DB_POOLER ildiz .env dan (standart pgbouncer). Migratsiyalar (entrypoint), queue, queue-reports, scheduler, reverb
  # va backup Postgres'ga to'g'ridan-to'g'ri ulanadi. DB_POOLER=direct = pulsiz, avvalgidek. docs/OPERATIONS.md, «Bazaga ulanishlar puli»
  DB_POOLER: direct
  DB_POOL_HOST: pgbouncer
  DB_POOL_PORT: 6432
  # M4 3-bosqich, qator darajasidagi himoya (RLS): TENANT_RLS=1 bo'lsa do'kon so'rovining (kassa, panel, xodim ilovasi)
  # har tranzaksiyasi rizqim_tenant roli bilan ishlaydi va PostgreSQL boshqa do'kon qatorlarini o'zi rad etadi. Bo'sh
  # yoki 0 = rolga o'tilmaydi, hammasi avvalgidek (qaytarish: ildiz .env da TENANT_RLS=0, so'ng docker compose up -d).
  # Rollar ajratilgan bo'lishi shart (DB_OWNER_USERNAME). docs/OPERATIONS.md, 24-bo'lim
  TENANT_RLS: ${TENANT_RLS:-0}
  DB_TENANT_ROLE: ${DB_TENANT_ROLE:-rizqim_tenant}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  # Real-time updates (Laravel Reverb, `reverb` xizmati). M2: standart bo'yicha YOQIQ (reverb). Ildiz .env da
  # REVERB_APP_ID/KEY/SECRET bo'lmasa, backend konteyneri ularni birinchi ishga tushishda bir marta yaratadi va
  # backend_storage volume'ida (storage/app/.realtime/reverb.env, faqat root o'qiydi) saqlaydi; queue, scheduler va reverb
  # shu fayldan oladi (backend/docker/entrypoint.sh). Qiymatlar logga chiqmaydi va repoga tushmaydi. Ildiz .env da
  # kalitlar bo'lsa, o'shalar ishlatiladi (hech qachon ustiga yozilmaydi). Ilovalar kalitni GET /api/v1/realtime dan oladi
  # (build paytidagi VITE_REVERB_APP_KEY / RIZQIM_REVERB_KEY bo'sh bo'lsa). Backend Reverb'ga compose tarmog'i ichida HTTP
  # orqali (reverb:8080) yozadi; brauzerlar Mini App origin'i orqali (frontend nginx /app/ ni reverb:8080 ga proksi qiladi).
  # O'chirish (rollback): ildiz .env da BROADCAST_CONNECTION=null, so'ng docker compose up -d: hammasi so'rov bilan
  # ishlaydi, boshqa hech narsa o'zgarmaydi. docs/DEPLOY.md (9-bo'lim), docs/OPERATIONS.md («Real-time»)
  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
  REVERB_APP_ID: ${REVERB_APP_ID:-}
  REVERB_APP_KEY: ${REVERB_APP_KEY:-}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-*}
  # M3 monitoring: PITR o'chiq bo'lsa (bo'sh/0) WAL, PITR va tiklash mashqi ogohlantirishlari jim, Monitoring «o'chiq» deydi.
  # HEALTHCHECKS_PING_URL: healthchecks.io (yoki shunga o'xshash) manzili; scheduler har daqiqalik tekshiruvdan keyin unga
  # so'rov yuboradi: so'rovlar to'xtasa (server, scheduler yoki baza ishlamasa) o'sha xizmat egaga xabar beradi. Bo'sh = yo'q.
  PITR_ENABLED: ${PITR_ENABLED:-0}
  HEALTHCHECKS_PING_URL: ${HEALTHCHECKS_PING_URL:-}
  # db_connections qoidasi PgBouncer'ning chegarasini pgbouncer xizmati bilan bir xil qiymatdan oladi
  PGBOUNCER_MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_DB_CONNECTIONS:-30}

# M3 uzluksiz zaxira (PITR, pgBackRest): `postgres` (arxiv buyrug'i, WAL'ni yuboradi) va `backup` (to'liq/farq zaxiralari,
# tiklash, tiklash mashqi) bir xil sozlamani oladi (infra/postgres/pitr-env.sh). Hammasi ildiz .env dan; bo'sh = o'chiq.
# repo1 = shu serverdagi pgbackrest_repo volume'i; repo2 = S3 (PITR_S3_* yoki, ular bo'sh bo'lsa, BACKUP_S3_*),
# AES-256 bilan shifrlangan: PITR_CIPHER_PASS SHART (yo'qolsa S3 dagi nusxalar o'qilmaydi, server tashqarisida saqlang).
x-pitr-environment: &pitr-environment
  PITR_ENABLED: ${PITR_ENABLED:-0}
  PITR_CIPHER_PASS: ${PITR_CIPHER_PASS:-}
  PITR_S3_ENDPOINT: ${PITR_S3_ENDPOINT:-${BACKUP_S3_ENDPOINT:-}}
  PITR_S3_BUCKET: ${PITR_S3_BUCKET:-${BACKUP_S3_BUCKET:-}}
  PITR_S3_ACCESS_KEY: ${PITR_S3_ACCESS_KEY:-${BACKUP_S3_ACCESS_KEY:-}}
  PITR_S3_SECRET: ${PITR_S3_SECRET:-${BACKUP_S3_SECRET:-}}
  PITR_S3_REGION: ${PITR_S3_REGION:-${BACKUP_S3_REGION:-}}
  PITR_S3_PREFIX: ${PITR_S3_PREFIX:-${BACKUP_S3_PREFIX:-}}
  PITR_S3_URI_STYLE: ${PITR_S3_URI_STYLE:-path}
  PITR_S3_VERIFY_TLS: ${PITR_S3_VERIFY_TLS:-y}
  PITR_REPO1_RETENTION_FULL: ${PITR_REPO1_RETENTION_FULL:-2}
  PITR_S3_RETENTION_FULL: ${PITR_S3_RETENTION_FULL:-4}
  PITR_ARCHIVE_QUEUE_MAX: ${PITR_ARCHIVE_QUEUE_MAX:-4GiB}

# Ikkala navbat ishchisi uchun umumiy qism: backend sog'lom bo'lgach (migratsiyalar tugagach) ishga tushadi.
# SIGTERM'da ishchi joriy jobni tugatib chiqadi; eng uzun job (SendOrderReport) 120 s, shuning uchun standart 10 s emas.
x-queue-worker: &queue-worker
  <<: *backend
  environment:
    <<: *backend-environment
    RUN_MIGRATIONS: "false"
  depends_on:
    postgres:
      condition: service_healthy
    db-roles:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    backend:
      condition: service_healthy
  stop_grace_period: 150s

services:
  # M3: rasmiy postgres:17-alpine + pgBackRest (infra/postgres/Dockerfile). Server, ma'lumotlar papkasi va postgres_data
  # volume'i o'zgarmagan: mavjud o'rnatish o'z ma'lumoti bilan ishga tushadi. Uzluksiz zaxira (PITR) faqat ildiz .env da
  # PITR_ENABLED=1 bo'lsa yoqiladi; bo'lmasa arxiv buyrug'i hech narsa qilmaydi (0 bilan chiqadi), WAL avvalgidek
  # qayta ishlatiladi. archive_mode ni yoqish uchun birinchi deploy'da Postgres BIR MARTA qayta ishga tushadi (soniyalar).
  # archive_timeout=60: biror narsa yozilgan bo'lsa, eng ko'pi 60 s da WAL segmenti arxivga ketadi (yo'qotish oynasi).
  # docker-compose.staging.yml `command` ni almashtiradi: u yerda ham shu bayroqlar takrorlangan. docs/OPERATIONS.md, «Uzluksiz zaxira (PITR)»
  postgres:
    build:
      context: ./infra/postgres
    restart: unless-stopped
    # PID 1 = Docker's tini, not the postmaster: pgBackRest's async archive-push detaches a worker; orphaned, it would be
    # reparented to PID 1, and a postmaster that reaps an unknown child exiting non-zero treats it as a crashed backend
    # and restarts the whole cluster (seen in CI). tini reaps it instead; signals still reach postgres
    init: true
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=/usr/local/bin/pgbackrest-archive.sh %p
      - -c
      - archive_timeout=60
      - -c
      - wal_compression=lz4
      - -c
      - max_wal_size=2GB
    environment:
      POSTGRES_DB: ${DB_DATABASE:-rizqimbot}
      # M4: bootstrap superuser (faqat postgres, backup, db-roles). POSTGRES_USER bo'sh = DB_USERNAME (bitta rol, avvalgidek).
      # Rollar ajratilganda (DB_OWNER_USERNAME bor): POSTGRES_USER = eski DB_USERNAME, DB_USERNAME = rizqim_app. docs/OPERATIONS.md, «Baza rollari»
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USERNAME:-rizqimbot}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-secret}}
      # Set = the data is a host path (pitr-switch.sh): infra/postgres/entrypoint.sh then refuses to create an empty database
      RIZQIM_DATA_SOURCE: ${POSTGRES_DATA_VOLUME:-}
      <<: *pitr-environment
    volumes:
      # POSTGRES_DATA_VOLUME bo'sh = postgres_data (avvalgi volume, o'zgarmaydi). Faqat PITR tiklangan nusxani ishga
      # tushirish runbook'ida (docs/OPERATIONS.md) xostdagi mutlaq papka yo'li beriladi; `backup` ham xuddi shu manbani o'qiydi
      - ${POSTGRES_DATA_VOLUME:-postgres_data}:/var/lib/postgresql/data
      - pgbackrest_repo:/var/lib/pgbackrest
      - pgbackrest_spool:/var/spool/pgbackrest
      # Unix soket `backup` bilan umumiy: pgBackRest zaxira olganda Postgres'ga shu soket orqali ulanadi
      - pg_run:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-${DB_USERNAME:-rizqimbot}} -d ${DB_DATABASE:-rizqimbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Ulanishlar puli: har php-fpm so'rovi yangi Postgres ulanishi ochmaydi (~20 ms va Postgres protsessorining katta
  # qismi), PgBouncer'ning tayyor ulanishlaridan birini bitta tranzaksiyaga oladi. Tashqariga port ochilmagan.
  # Postgres'ga eng ko'pi PGBOUNCER_MAX_DB_CONNECTIONS ulanish (+ to'g'ridan-to'g'ri ulanadigan xizmatlar) max_connections
  # (100) dan kam bo'lishi shart: hisob docs/OPERATIONS.md, «Bazaga ulanishlar puli». Obraz va sozlama: infra/pgbouncer/
  pgbouncer:
    build:
      context: ./infra/pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-rizqimbot}
      DB_USERNAME: ${DB_USERNAME:-rizqimbot}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      PGBOUNCER_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-20}
      PGBOUNCER_RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-5}
      PGBOUNCER_MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_DB_CONNECTIONS:-30}
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-1000}
      PGBOUNCER_QUERY_WAIT_TIMEOUT: ${PGBOUNCER_QUERY_WAIT_TIMEOUT:-30}
    expose:
      - "6432"
    depends_on:
      postgres:
        condition: service_healthy
      # M4: ilova rolining paroli (DB_USERNAME/DB_PASSWORD, userlist) db-roles qo'ygandan keyin
      db-roles:
        condition: service_completed_successfully
    # Pul orqali haqiqiy so'rov (auth + Postgres'gacha yo'l)
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$DB_PASSWORD\" psql -h 127.0.0.1 -p 6432 -U \"$$DB_USERNAME\" -d \"$$DB_DATABASE\" -Atqc 'select 1' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # M4: baza rollari (scripts/db-roles.sh, bir martalik): rizqim_owner (jadvallar egasi: migratsiyalar, db:partitions:*),
  # rizqim_app (DB_USERNAME: faqat ma'lumot, pg_monitor, BYPASSRLS; php-fpm, queue, scheduler, reverb, PgBouncer),
  # rizqim_tenant (NOLOGIN: TENANT_RLS=1 da do'kon tranzaksiyalari shu rol bilan, RLS siyosatlari unga ta'sir qiladi). Har `up` da
  # ishlaydi va qayta ishga tushirish xavfsiz: yo'q rollarni yaratadi, parollarni env'dan qo'yadi (almashtirish), huquqlar,
  # egasi rizqim_owner bo'lmagan obyektlarni ko'chiradi (lock_timeout 2s, har biri alohida). DB_OWNER_USERNAME bo'sh =
  # rollar ajratilmagan: hech narsa qilmaydi. Bootstrap superuser bilan ulanadi. docs/OPERATIONS.md, «Baza rollari»
  db-roles:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-${DB_USERNAME:-rizqimbot}}
      PGPASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-secret}}
      DB_DATABASE: ${DB_DATABASE:-rizqimbot}
      DB_USERNAME: ${DB_USERNAME:-rizqimbot}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_OWNER_USERNAME: ${DB_OWNER_USERNAME:-}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-}
      # M4 3-bosqich: do'kon tranzaksiyasi roli (NOLOGIN; ilova unga SET LOCAL ROLE bilan o'tadi, x-backend-environment)
      DB_TENANT_ROLE: ${DB_TENANT_ROLE:-rizqim_tenant}
    volumes:
      - ./scripts/db-roles.sh:/usr/local/bin/db-roles.sh:ro
    entrypoint: ["sh", "/usr/local/bin/db-roles.sh"]

  # Kesh, navbat (queue), sessiya va rate-limit shu yerda. Tashqariga port ochilmagan (faqat compose tarmog'i).
  # --appendonly: navbatdagi joblar Redis qayta ishga tushganda yo'qolmasin.
  # maxmemory-policy ni allkeys-*/volatile-* qilmang: Redis navbat va sessiya kalitlarini ham o'chirib yuboradi.
  # --requirepass "" parolsiz degani; REDIS_PASSWORD to'ldirilsa Redis va barcha backend xizmatlari shu parolni ishlatadi.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Xotira chegarasi (noeviction): chegaraga yetganda Redis yozishni rad etadi, lekin butun serverni xotirasiz
    # qoldirmaydi. used_memory 80 % dan oshsa ogohlantiring (docs/OPERATIONS.md, 15-bo'lim).
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}", "--maxmemory", "${REDIS_MAXMEMORY:-1gb}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\" --no-auth-warning} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Veb-konteyner: deploy qadamlarini shu bajaradi (RUN_MIGRATIONS=true), shuning uchun healthcheck migratsiyalar
  # tugab nginx ishga tushgandan keyingina o'tadi; queue, scheduler va frontend shuni kutadi.
  backend:
    <<: *backend
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS: "true"
      # php-fpm so'rovlari PgBouncer orqali; migratsiyalar baribir to'g'ridan-to'g'ri (entrypoint). Pulni o'chirish
      # (masalan PgBouncer nosoz bo'lsa): ildiz .env da DB_POOLER=direct, so'ng docker compose up -d backend
      DB_POOLER: ${DB_POOLER:-pgbouncer}
      # pgbouncer xizmatining puli bilan bir xil qiymat: backend ishga tushganda php-fpm ishchilari (FPM_*_CHILDREN
      # yig'indisi) shu puldan oshmasligini tekshiradi, aks holda bozor puli kassalarning bazaga ulanishini olib qo'yadi
      # (backend/docker/pools.sh; docs/OPERATIONS.md, «Bazaga ulanishlar puli»)
      PGBOUNCER_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-20}
      # M4: migratsiyalar jadvallar egasi roli bilan (entrypoint). php-fpm bu qiymatlarni olmaydi (entrypoint ularni
      # supervisord'dan oldin o'chiradi), config:cache ham yozmaydi. Bo'sh = bitta rol (DB_USERNAME), avvalgidek
      DB_OWNER_USERNAME: ${DB_OWNER_USERNAME:-}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-}
    # Faqat 127.0.0.1 da (partner-web va platform-admin kabi): /up (va API) ni shu xostdagi tashqi proksi oladi. Backend xususiy tarmoqdan kelgan X-Forwarded-For ga ishonadi (bootstrap/app.php trustProxies): port
    # internetga ochiq bo'lsa, Docker userland proksisi orqali kelgan so'rov (masalan IPv6) ichki manzildan kelgandek
    # ko'rinib, soxta IP bilan kirish limitlarini aylanib o'tardi. Proksi boshqa xostda bo'lsa BACKEND_BIND (va firewall).
    # docs/OPERATIONS.md, 10-bo'lim
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # M4: rollar va egalik tayyor (DB_OWNER_USERNAME bo'sh bo'lsa db-roles darhol 0 bilan tugaydi)
      db-roles:
        condition: service_completed_successfully
      # service_started (healthy emas): DB_POOLER=direct bilan PgBouncer nosoz bo'lsa ham backend ishga tushsin.
      # Pul orqali ishlaganda entrypoint uning portini kutadi, /health esa bazaga pul orqali ulanib tekshiradi
      pgbouncer:
        condition: service_started
    # /health (GET, JSON): bazaga va Redis'ga haqiqatan ulanishni tekshiradi, shuning uchun /up (faqat "ilova ishga tushdi")
    # dan aniqroq. Ular ishlamasa 503 qaytaradi (wget xato kodi bilan chiqadi). Scheduler yoki navbat muammosi 200 (degraded)
    # beradi, shuning uchun u backend'ni nosog'lom qilmaydi (scheduler/queue shu healthcheck'ni kutadi). docs/OPERATIONS.md
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s

  # Navbat ishchilari QUEUE_CONNECTION ga ergashadi (redis; 'database' zaxira). Ikki ishchi: og'ir hisobotlar (SendOrderReport, `reports` navbati)
  # Telegram xabarlari (`default` navbati) ortidan navbat kutib qolmasin va xotira cheklovi bilan ajratilgan bo'lsin.
  # `broadcasts` (Reverb real-time eventlari, bir urinish) shu ishchida, `default` dan keyin: Reverb ishlamay qolsa ham
  # Telegram joblari oldinda turadi. queue:restart (entrypoint) ikkalasini ham yangilaydi.
  queue:
    <<: *queue-worker
    command: ["php", "artisan", "queue:work", "--queue=default,broadcasts", "--tries=3", "--max-time=3600"]

  # `reports` navbati: SendOrderReport (CSV hisobot, job timeout 120 s). --memory=512 ishchining yumshoq chegarasi
  # (job tugagach chiqadi), -d memory_limit=768M esa PHP'ning qattiq chegarasi (standart 128M bo'lsa --memory ma'nosiz).
  queue-reports:
    <<: *queue-worker
    command: ["php", "-d", "memory_limit=768M", "artisan", "queue:work", "--queue=reports", "--memory=512", "--timeout=150", "--tries=1", "--max-time=3600"]

  # To'lanmagan onlayn buyurtmalarni bekor qilish kabi rejalashtirilgan vazifalar uchun.
  scheduler:
    <<: *backend
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS: "false"
      # M4: db:partitions:ensure (00:40) va :archive (22:40) jadvallar egasi roli bilan; boshqa hamma narsa DB_USERNAME
      DB_OWNER_USERNAME: ${DB_OWNER_USERNAME:-}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]
    # Har daqiqada kesh'ga yoziladigan yurak urishi (health-heartbeat) 3 daqiqadan eskirsa yoki yo'q bo'lsa nosog'lom.
    # Healthcheck root nomidan ishlaydi: artisan www-data nomidan chaqiriladi (aks holda storage/logs root'niki bo'lib qoladi).
    healthcheck:
      test: ["CMD-SHELL", "su-exec www-data php artisan health:scheduler || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 180s

  # WebSocket server (Laravel Reverb): buyurtma holatlari Mini App'ga real vaqtda (routes/channels.php dagi private
  # kanallar, POST /api/broadcasting/auth). Tashqariga port ochilmagan: brauzer frontend nginx orqali (/app/)
  # ulanadi, backend/queue esa compose tarmog'ida reverb:8080 ga yozadi. Eventlar `broadcasts` navbati orqali yuboriladi (`queue`).
  # Yangi kod `docker compose up -d --build` da qayta yaratish bilan keladi. docs/DEPLOY.md
  reverb:
    <<: *backend
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    expose:
      - "8080"
    # Har WebSocket ulanishi bitta fayl deskriptori: konteynerning standart cheklovi (Docker'ga qarab 1024 bo'lishi mumkin)
    # ko'p ulanishda "Too many open files" beradi. Event loop ext-uv (backend/Dockerfile) bilan stream_select ning ~1000
    # ulanish chegarasi yo'q, shuning uchun nofile ni aniq oshiramiz. docs/OPERATIONS.md, 6-bo'lim
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # M2: nosog'lom = soketlar ochiq, lekin eventlar kelmaydi (Wolt hodisasi): Reverb'ning o'z /up yo'li javob bermasa,
    # REVERB_SCALING_ENABLED bilan Redis javob bermasa, heartbeat (scheduler -> broadcasts navbati -> Reverb, har 30 s)
    # REALTIME_HEARTBEAT_STALE_SECONDS (120) dan eskirsa yoki broadcasts navbati REALTIME_QUEUE_BACKLOG_THRESHOLD (500)
    # dan oshsa. Ilovalar shu holatni GET /api/v1/realtime (live) va heartbeat jimligidan biladi va tez so'rovga o'tadi.
    # artisan www-data nomidan (root yaratgan log faylini php-fpm yoza olmaydi). docs/OPERATIONS.md, «Real-time»
    healthcheck:
      test: ["CMD-SHELL", "su-exec www-data php artisan realtime:health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s

  frontend:
    build:
      # Ildiz: Mini App umumiy packages/ts/ui, staff va api-client paketlariga bog'liq (P1-25, P2-13). Image'ga nimalar kirishi: customer/miniapp/Dockerfile.dockerignore
      context: .
      dockerfile: customer/miniapp/Dockerfile
      args:
        VITE_BOT_USERNAME: ${VITE_BOT_USERNAME:-rizqimbot}
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:-}
        VITE_MAP_ATTRIBUTION: ${VITE_MAP_ATTRIBUTION:-}
        # Mahsulot formasidagi "Web panelda tahrirlash" havolasi (https://panel.<domen>); bo'sh = havolasiz matn
        VITE_PARTNER_WEB_URL: ${VITE_PARTNER_WEB_URL:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-production}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0}
        # Mini App statistikasi o'z serverimizga (true = yoqilgan, standart o'chiq). customer/miniapp/README.md "Analitika"
        VITE_ANALYTICS_ENABLED: ${VITE_ANALYTICS_ENABLED:-}
        # Reverb (WebSocket) ulanishi: kalit backend bilan bir xil (ildiz .env dagi REVERB_APP_KEY). Bo'sh host =
        # Mini App ochilgan domen (window.location.hostname); port/scheme tashqi HTTPS proksi bo'yicha (443/https)
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-${REVERB_APP_KEY:-}}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    # Mini App nginx orqali backend'gacha butun zanjir (nginx -> /api/ proksi -> backend -> baza/Redis) ishlayaptimi
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # pos.rizqim.uz: POS ilovalarini yuklab olish sahifasi (infra/pos-site, statik nginx). Sahifa GET /api/v1/pos/releases ni
  # (faqat shu manzilni) backend'dan oladi; ilova fayllari POS_FILES_DIR (standart ./pos-files) papkasidan /files/<ilova>/<platforma>/
  # bo'yicha beriladi (faqat o'qish). Tashqi TLS proksi pos.<domen> ni POS_SITE_PORT ga yo'naltiradi. docs/OPERATIONS.md, "POS ilovalarini chiqarish"
  pos-site:
    build:
      context: ./infra/pos-site
    restart: unless-stopped
    volumes:
      - ${POS_FILES_DIR:-./pos-files}:/usr/share/nginx/html/files:ro
    ports:
      - "${POS_SITE_BIND:-127.0.0.1}:${POS_SITE_PORT:-8090}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # rizqim.uz: landing va "Hamkor bo'lish" sahifasi (infra/landing, statik nginx, build qadamisiz). Forma faqat
  # POST /api/v1/store-applications va GET /api/v1/locations ni backend'ga uzatadi. Tashqi TLS proksi rizqim.uz (va www)
  # ni LANDING_PORT ga yo'naltiradi. Matn, aloqa va havolalar infra/landing/site/site.config.js da (egasi beradi). docs/OPERATIONS.md, 27-bo'lim
  landing:
    build:
      context: ./infra/landing
    restart: unless-stopped
    ports:
      - "${LANDING_BIND:-127.0.0.1}:${LANDING_PORT:-8091}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Hamkor veb-panel (partner/web, Next.js; restoran egasi va xodimlari, SMS kod bilan kiradi). Tashqi TLS proksi uni
  # alohida hostda beradi: panel.<domen> -> PARTNER_WEB_PORT (Mini App FRONTEND_PORT da bo'lgani kabi). Sozlamalar
  # runtime'da o'qiladi (image har muhitda bir xil): Next serveri backend'ga compose tarmog'i ichida (API_BASE_URL),
  # brauzer esa API'ga ochiq manzil orqali (PARTNER_PUBLIC_API_BASE_URL, masalan https://<domen>/api) murojaat qiladi,
  # shuning uchun backend/.env dagi CORS_ALLOWED_ORIGINS da panel origin'i (https://panel.<domen>) bo'lishi shart.
  # docs/DEPLOY.md (4-bo'lim), partner/web/README.md
  partner-web:
    build:
      # Ildiz: panel packages/ts/ui, staff va api-client ga bog'liq. Image'ga nimalar kirishi: partner/web/Dockerfile.dockerignore
      context: .
      dockerfile: partner/web/Dockerfile
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend/api
      PUBLIC_API_BASE_URL: ${PARTNER_PUBLIC_API_BASE_URL:-}
      # Sessiya cookie'lari faqat HTTPS orqali (production). false faqat http:// orqali sinash uchun
      SESSION_COOKIE_SECURE: ${PARTNER_SESSION_COOKIE_SECURE:-true}
      # Buyurtmalar doskasi uchun real-time (Reverb): kalit backend bilan bir xil (REVERB_APP_KEY). Host bo'sh = API host'i,
      # brauzer wss://<domen>/app/... ga ulanadi (frontend nginx uni reverb'ga uzatadi). Kalit bo'sh = doska so'rov bilan yangilanadi
      REVERB_APP_KEY: ${REVERB_APP_KEY:-}
      REVERB_HOST: ${PARTNER_REVERB_HOST:-}
      REVERB_PORT: ${PARTNER_REVERB_PORT:-443}
      REVERB_SCHEME: ${PARTNER_REVERB_SCHEME:-https}
      # Hududlar xaritasi plitkalari. Bo'sh = ochiq OSM serveri (faqat sinov uchun), production'da hisobli provayder
      MAP_TILE_URL: ${PARTNER_MAP_TILE_URL:-}
      MAP_ATTRIBUTION: ${PARTNER_MAP_ATTRIBUTION:-}
    depends_on:
      backend:
        condition: service_healthy
    # Faqat 127.0.0.1 da: panel kirish so'rovlarini backend'ga mijozning IP manzili bilan (X-Forwarded-For) uzatadi va bu
    # manzilni tashqi proksi yozgan oxirgi yozuvdan oladi. Portga proksini chetlab kelgan kishi o'z IP'sini soxtalashtirib
    # SMS/kod limitlarini aylanib o'tardi. Proksi boshqa xostda bo'lsa PARTNER_WEB_BIND (port faqat proksiga ochiq bo'lsin).
    # docs/DEPLOY.md, 4-bo'lim
    ports:
      - "${PARTNER_WEB_BIND:-127.0.0.1}:${PARTNER_WEB_PORT:-3000}:3000"
    # Kirish sahifasi (Next serveri ishlayapti); backend'ga ulanishni frontend healthcheck'i tekshiradi
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # RIZQIM boshqaruv markazi (platform/admin, Next.js): platforma jamoasi uchun. Brauzer backend'ga to'g'ridan-to'g'ri
  # murojaat qilmaydi: hamma so'rov ilovaning o'z /api/backend/... manzilidan o'tadi (token httpOnly cookie'da), shuning
  # uchun CORS sozlash va PUBLIC_API_BASE_URL kerak emas. docs/DEPLOY.md (4-bo'lim, «RIZQIM boshqaruv markazi»), platform/admin/README.md
  platform-admin:
    build:
      # Ildiz: ilova packages/ts/ui va api-client ga bog'liq. Image'ga nimalar kirishi: platform/admin/Dockerfile.dockerignore
      context: .
      dockerfile: platform/admin/Dockerfile
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend/api
      # Sessiya cookie'si faqat HTTPS orqali (production). false faqat http:// orqali sinash uchun
      SESSION_COOKIE_SECURE: ${ADMIN_SESSION_COOKIE_SECURE:-true}
    depends_on:
      backend:
        condition: service_healthy
    # Faqat 127.0.0.1 da (partner-web kabi): ilova mijoz IP manzilini (X-Forwarded-For) backend'ga uzatadi va uni tashqi
    # proksi yozgan oxirgi yozuvdan oladi; portga proksini chetlab kelgan kishi IP'sini soxtalashtirib kirish limitlarini
    # aylanib o'tardi. Proksi boshqa xostda bo'lsa ADMIN_WEB_BIND. docs/DEPLOY.md, 4-bo'lim, «RIZQIM boshqaruv markazi»
    ports:
      - "${ADMIN_WEB_BIND:-127.0.0.1}:${ADMIN_WEB_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # PostgreSQL zaxirasi: har kuni BACKUP_TIME (UTC, standart 21:30 = Toshkent 02:30) da pg_dump (custom format) -> BACKUP_HOST_DIR (standart ./backups),
  # BACKUP_RETENTION_DAYS kundan eskilari o'chiriladi. Ishga tushganda ham bitta zaxira oladi. Tashqi nusxa: BACKUP_OFFSITE_CMD
  # (ildizdagi .env.example) yoki BACKUP_S3_* (rclone, obraz infra/backup/Dockerfile). Tiklash: docker compose exec -it backup restore.sh /backups/<fayl>.dump <baza>. docs/OPERATIONS.md
  # Obraz postgres bilan bir xil versiya: pg_dump server versiyasidan eski bo'lmasligi shart.
  backup:
    # postgres:17-alpine + rclone (infra/backup/Dockerfile): BACKUP_S3_* berilsa har dump S3-mos xotiraga ham yuklanadi
    # Build context ./infra: PITR yordamchilari (infra/postgres/pitr-env.sh, archive.sh) postgres obrazi bilan bitta manbadan
    build:
      context: ./infra
      dockerfile: backup/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # M4: its start-up pg_dump (BACKUP_RUN_ON_START) must not hold every table while db-roles moves their owners
      db-roles:
        condition: service_completed_successfully
    environment:
      <<: *pitr-environment
      # M3 PITR: pgBackRest zaxirani shu konteynerdan oladi: ma'lumotlar papkasini faqat o'qiydi (:ro, yo'li serverniki
      # bilan bir xil), Postgres'ga umumiy soket orqali ulanadi, repo1 volume'iga yozadi. Tiklash va tiklash mashqi
      # pitr_restore volume'iga (/restore), ikkinchi Postgres 5499 portida (faqat compose tarmog'ida) ishga tushadi.
      # Har kecha BACKUP_TIME da: pgBackRest zaxirasi (yakshanba to'liq, boshqa kunlar farq) + expire, so'ng pg_dump, so'ng
      # jurnallar arxivi (scripts/archive-partitions.sh). Har 5 daqiqada monitoring_markers: `pitr` va `disk`.
      # Har oy birinchi yakshanba PITR_DRILL_TIME da tiklash mashqi (PITR_DRILL_MONTHLY=0 o'chiradi).
      RIZQIM_BACKUP_CONTAINER: "1"
      PITR_SPOOL_PATH: /tmp/pgbackrest-spool
      PITR_RESTORE_ROOT: /restore
      PITR_RESTORE_PORT: 5499
      PITR_DRILL_MONTHLY: ${PITR_DRILL_MONTHLY:-1}
      PITR_DRILL_TIME: ${PITR_DRILL_TIME:-23:00}
      PITR_PING_URL: ${PITR_PING_URL:-}
      # WAL zanjiridagi uzilish shuncha soniyadan keyin hisoblanadi (kechikib kelgan segmentlar uchun), S3 ro'yxati shuncha
      # soniyada bir (narx), uzilishdan keyingi avtomatik to'liq nusxa eng ko'pi shuncha soniyada bir urinish
      PITR_GAP_GRACE: ${PITR_GAP_GRACE:-600}
      PITR_GAP_S3_INTERVAL: ${PITR_GAP_S3_INTERVAL:-3600}
      PITR_HEAL_INTERVAL: ${PITR_HEAL_INTERVAL:-21600}
      # Jurnallar arxivi uchun S3 (bo'sh = BACKUP_S3_*). Arxiv o'chmasligi kerak: o'chirish huquqisiz alohida kalit yoki
      # Object Lock'li alohida bucket (scripts/archive-partitions.sh har kecha tekshiradi va ogohlantiradi)
      ARCHIVE_S3_ENDPOINT: ${ARCHIVE_S3_ENDPOINT:-}
      ARCHIVE_S3_BUCKET: ${ARCHIVE_S3_BUCKET:-}
      ARCHIVE_S3_ACCESS_KEY: ${ARCHIVE_S3_ACCESS_KEY:-}
      ARCHIVE_S3_SECRET: ${ARCHIVE_S3_SECRET:-}
      ARCHIVE_S3_REGION: ${ARCHIVE_S3_REGION:-}
      ARCHIVE_S3_PREFIX: ${ARCHIVE_S3_PREFIX:-}
      PGHOST: postgres
      PGPORT: 5432
      # M4: zaxira, PITR, tiklash mashqi va jurnallar arxivi bootstrap superuser bilan (hamma qatorni o'qiydi, DETACH/ATTACH)
      PGUSER: ${POSTGRES_USER:-${DB_USERNAME:-rizqimbot}}
      PGPASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-secret}}
      PGDATABASE: ${DB_DATABASE:-rizqimbot}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_TIME: ${BACKUP_TIME:-21:30}
      BACKUP_OFFSITE_CMD: ${BACKUP_OFFSITE_CMD:-}
      # Server tashqarisiga nusxa (S3-mos: AWS S3, Cloudflare R2, Backblaze B2, MinIO). Bo'sh bo'lsa hech narsa qilinmaydi;
      # endpoint, bucket, kalit va maxfiy kalit to'rttasi ham kerak. scripts/backup.sh, docs/OPERATIONS.md, 4-bo'lim
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET: ${BACKUP_S3_SECRET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
      BACKUP_S3_RETENTION_DAYS: ${BACKUP_S3_RETENTION_DAYS:-}
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ./scripts/restore.sh:/usr/local/bin/restore.sh:ro
      # M3 PITR va jurnallar arxivi
      - ./scripts/pitr.sh:/usr/local/bin/pitr.sh:ro
      - ./scripts/pitr-drill.sh:/usr/local/bin/pitr-drill.sh:ro
      - ./scripts/pitr-restore.sh:/usr/local/bin/pitr-restore.sh:ro
      - ./scripts/archive-partitions.sh:/usr/local/bin/archive-partitions.sh:ro
      - ./scripts/archive-restore.sh:/usr/local/bin/archive-restore.sh:ro
      - ${POSTGRES_DATA_VOLUME:-postgres_data}:/var/lib/postgresql/data:ro
      - pgbackrest_repo:/var/lib/pgbackrest
      # Faqat o'lchash uchun (disk belgisi: navbatdagi WAL hajmi)
      - pgbackrest_spool:/var/spool/pgbackrest:ro
      - pg_run:/var/run/postgresql
      - pitr_restore:/restore
    command: ["sh", "/usr/local/bin/backup.sh", "--daemon"]

volumes:
  postgres_data:
  # M3 PITR: pgBackRest repo1 (zaxiralar va arxivlangan WAL), async arxiv navbati, umumiy unix soket, tiklash joyi
  pgbackrest_repo:
  pgbackrest_spool:
  pg_run:
  pitr_restore:
  redis_data:
  backend_storage:
