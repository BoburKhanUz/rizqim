  # --- P4-12 Platform admin e2e (Playwright; runs with the platform-admin filter) -------------------------------------
  platform-admin-e2e:
    name: Platform admin e2e (Playwright, fake backend)
    needs: changes
    if: needs.changes.outputs.platformadmin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform/admin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            platform/admin/package-lock.json
            packages/ts/api-client/package-lock.json

      - name: Build the API client
        working-directory: packages/ts/api-client
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: npm ci

      # Playwright's own Chromium. The backend is a fake inside the test worker: nothing else is started. The test builds and
      # starts the production app itself (next build + start).
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
