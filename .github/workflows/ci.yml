name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which jobs below are needed: a job runs only when a path it depends on changed. A change to this workflow
  # file runs everything. Skipped jobs count as passed for branch protection (unlike a workflow-level `paths:` filter,
  # which would leave required checks pending). Add a filter here when a new app gets its own job.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      miniapp: ${{ steps.filter.outputs.miniapp }}
      infra: ${{ steps.filter.outputs.infra }}
      apiclient: ${{ steps.filter.outputs.apiclient }}
      partnerweb: ${{ steps.filter.outputs.partnerweb }}
      # P4-12: the RIZQIM control center (platform-admin and platform-admin-e2e jobs)
      platformadmin: ${{ steps.filter.outputs.platformadmin }}
      staffpkg: ${{ steps.filter.outputs.staffpkg }}
      flutter: ${{ steps.filter.outputs.flutter }}
      e2estack: ${{ steps.filter.outputs.e2estack }}
      # P3-15: POS packages (pos-packages job)
      pospkg: ${{ steps.filter.outputs.pospkg }}
      # P3-33: the POS stack end-to-end test (pos-stack-e2e job)
      posstack: ${{ steps.filter.outputs.posstack }}
      # M3: PITR end to end in the compose topology (pitr-drill job)
      pitr: ${{ steps.filter.outputs.pitr }}
      # P6 hardware: the Android builds of the POS apps (android-build job; Kotlin is compiled only there). The same
      # paths gate the Windows builds (windows-build job: pos/** and packages/dart/**)
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              # P1-11: the committed OpenAPI spec is checked against the code in backend-tests
              - 'packages/api-spec/**'
              - '.github/workflows/ci.yml'
            miniapp:
              - 'customer/miniapp/**'
              # P1-25: the design system the Mini App links from packages/ts/ui
              - 'packages/ts/ui/**'
              # P2-13: the staff screens' shared package and the API client it is built on
              - 'packages/ts/staff/**'
              - 'packages/ts/api-client/**'
              - '.github/workflows/ci.yml'
            # P1-11: TypeScript packages and the spec their API client is generated from (api-client job)
            apiclient:
              - 'packages/ts/**'
              - 'packages/api-spec/**'
              - '.github/workflows/ci.yml'
            # P1-13: compose files, images and shell scripts (infra job at the end of this file)
            infra:
              - 'docker-compose*.yml'
              - '.env*.example'
              - 'backend/Dockerfile'
              - 'backend/docker/**'
              # P2-33: the backend image installs composer.lock and dumps the optimized autoloader over the app code, and
              # the Reverb/ext-uv check runs in it: a dependency or app change can break the image build
              - 'backend/composer.json'
              - 'backend/composer.lock'
              - 'backend/.dockerignore'
              - 'backend/app/**'
              - 'backend/bootstrap/**'
              - 'backend/config/**'
              - 'backend/routes/**'
              - 'backend/database/**'
              - 'scripts/**'
              - 'infra/**'
              # The Mini App and partner web images are built here from the repository root: any change to the apps or
              # the TypeScript packages they link (packages/ts) can break the image build (lockfiles, file: links, build)
              - 'customer/miniapp/**'
              - 'partner/web/**'
              - 'platform/admin/**'
              - 'packages/ts/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            # P1-25: the partner web (partner/web) and the TypeScript packages it links (packages/ts: ui, api-client)
            partnerweb:
              - 'partner/web/**'
              - 'packages/ts/**'
              - '.github/workflows/ci.yml'
            # P4-12: the RIZQIM control center (platform/admin) and the TypeScript packages it links (packages/ts: ui, api-client)
            platformadmin:
              - 'platform/admin/**'
              - 'packages/ts/**'
              - '.github/workflows/ci.yml'
            # P2-13: the shared staff package (packages/ts/staff) and what it is built on (staff-package job)
            staffpkg:
              - 'packages/ts/staff/**'
              - 'packages/ts/ui/**'
              - 'packages/ts/api-client/**'
              - 'packages/api-spec/**'
              - '.github/workflows/ci.yml'
            # P1-26: the Dart workspace (pubspec.yaml at the root), the Flutter apps, and the spec the Dart client is
            # generated from (flutter job at the end of this file)
            flutter:
              - 'packages/dart/**'
              - 'packages/api-spec/**'
              - 'pos/**'
              - 'courier/**'
              - 'partner/mobile/**'
              - 'customer/mobile/**'
              - 'pubspec*'
              - 'analysis_options.yaml'
              - '.github/workflows/ci.yml'
            # P3-15: the POS packages (pos/packages/*) and the shared Dart packages they build on (pos-packages job)
            pospkg:
              - 'pos/packages/**'
              - 'packages/dart/rizqim_core/**'
              - 'packages/dart/rizqim_ui/**'
              # P3-20: pos_data is built on the API client
              - 'packages/dart/rizqim_api/**'
              - 'pubspec*'
              - 'analysis_options.yaml'
              - '.github/workflows/ci.yml'
            # P2-31: the cross-app end-to-end test against the real stack (e2e-stack job): the backend (and the spec its clients
            # are generated from), both web apps, the TypeScript packages and the test itself
            e2estack:
              - 'backend/**'
              - 'packages/api-spec/**'
              - 'partner/web/**'
              # P4-12: the control center journey (tests/admin-journey.spec.ts) runs in the same stack
              - 'platform/admin/**'
              - 'customer/miniapp/**'
              - 'packages/ts/**'
              - 'e2e/**'
              - 'scripts/e2e-stack.sh'
              - '.github/workflows/ci.yml'
            # P6 hardware: the POS apps' Android builds (android-build job): the apps and plugins under pos/ and the shared
            # Dart packages they link
            android:
              - 'pos/**'
              - 'packages/dart/**'
              - 'pubspec*'
              - '.github/workflows/ci.yml'
            # P3-33: the POS stack end-to-end test against the real backend (pos-stack-e2e job): the backend, the POS packages
            # and the API client they are built on, the test and its script
            posstack:
              - 'backend/**'
              - 'pos/packages/**'
              - 'packages/dart/rizqim_api/**'
              - 'e2e/pos/**'
              - 'scripts/pos-e2e.sh'
              - 'pubspec*'
              - '.github/workflows/ci.yml'
            # M3: the PITR images, the compose services they run in, the backup/restore scripts and the migrations the
            # drill restores and checks (pitr-drill job)
            pitr:
              - 'infra/postgres/**'
              - 'infra/backup/**'
              - 'infra/ci/**'
              - 'docker-compose.yml'
              - 'docker-compose.staging.yml'
              - '.env.example'
              - 'scripts/backup.sh'
              - 'scripts/pitr*.sh'
              - 'scripts/restore-drill.sh'
              - 'scripts/archive-*.sh'
              - 'backend/database/migrations/**'
              - '.github/workflows/ci.yml'

  backend-tests:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Same major version as docker-compose.yml (postgres:17-alpine) and the backup image (infra/backup/Dockerfile)
        image: postgres:17
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: rizqim
          POSTGRES_PASSWORD: rizqim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rizqim -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, intl, gd, bcmath, zip
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      # phpunit.xml switches cache/queue/session to array/sync, so the tests need no Redis
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^APP_ENV=.*/APP_ENV=testing/' \
            -e 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' \
            -e 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' \
            -e 's/^DB_PORT=.*/DB_PORT=5432/' \
            -e 's/^DB_DATABASE=.*/DB_DATABASE=testing/' \
            -e 's/^DB_USERNAME=.*/DB_USERNAME=rizqim/' \
            -e 's/^DB_PASSWORD=.*/DB_PASSWORD=rizqim/' \
            .env

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate APP_KEY
        run: php artisan key:generate --ansi

      - name: Run tests
        run: php artisan test

      # P1-11: packages/api-spec/openapi.json must be what the code generates (model schemas come from the migrated
      # database, hence the migrate)
      - name: OpenAPI spec is up to date
        run: |
          php artisan migrate --force --no-interaction
          if ! php artisan api-spec:export --check; then
            echo "::error file=packages/api-spec/openapi.json::OpenAPI spetsifikatsiyasi koddan orqada. Yangilang: cd backend && php artisan migrate && php artisan api-spec:export; cd packages/ts/api-client && npm run generate; so'ng commit qiling."
            # What differs, so a drift that does not reproduce locally can be read from the log
            php artisan api-spec:export >/dev/null
            git diff --stat -- ../packages/api-spec/openapi.json
            git diff -U2 -- ../packages/api-spec/openapi.json | head -300
            exit 1
          fi

  backend-static-analysis:
    name: Backend static analysis (PHPStan)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, intl, gd, bcmath, zip
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      # Larastan boots the application (no database connection is made)
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i -e 's/^APP_ENV=.*/APP_ENV=testing/' .env

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=table

  frontend:
    name: Mini App (lint, tests, build)
    needs: changes
    if: needs.changes.outputs.miniapp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer/miniapp
    env:
      # Only the manual test-browser.js script uses puppeteer; CI never needs its Chrome download
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            customer/miniapp/package-lock.json
            packages/ts/api-client/package-lock.json

      # P2-13: the Mini App links packages/ts/api-client (compiled to dist/, its "main") and packages/ts/staff (source)
      - name: Build the API client
        working-directory: packages/ts/api-client
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Mini App e2e (Playwright)
    needs: changes
    if: needs.changes.outputs.miniapp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer/miniapp
    env:
      # Only the manual test-browser.js script uses puppeteer; CI never needs its Chrome download
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            customer/miniapp/package-lock.json
            packages/ts/api-client/package-lock.json

      # P2-13: the Mini App links packages/ts/api-client (compiled to dist/, its "main") and packages/ts/staff (source)
      - name: Build the API client
        working-directory: packages/ts/api-client
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: npm ci

      # Playwright's own Chromium; the API is mocked in the browser, so no backend is started
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            customer/miniapp/playwright-report
            customer/miniapp/test-results
          retention-days: 7

  # --- P1-13 infra checks (runs only when an infra path changed, see the `infra` filter above) ---------------------
  infra:
    name: Infra (compose, shellcheck, images)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # compose reads env_file ./backend/.env, so it must exist even for `config`
      - name: Compose files are valid (production and staging)
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.staging.yml config -q
          cp .env.staging.example .env
          cp backend/.env.staging.example backend/.env
          docker compose config -q

      - name: Shellcheck
        run: |
          shellcheck scripts/*.sh backend/docker/entrypoint.sh backend/docker/pools.sh infra/staging/*.sh infra/pgbouncer/*.sh infra/postgres/*.sh scripts/scale-test/pgbouncer.sh scripts/scale-test/server.sh scripts/scale-test/env.sh

      # Guards of the POS stack script (live pid file, --stop); needs no backend or Dart
      - name: pos-e2e.sh guards
        run: scripts/pos-e2e.test.sh

      # The script edits the Mini App nginx config at container start; fail here if that config changes shape
      - name: Staging noindex script still matches the Mini App nginx config
        run: |
          cp customer/miniapp/docker/nginx.conf "$RUNNER_TEMP/nginx.conf"
          NGINX_CONF="$RUNNER_TEMP/nginx.conf" sh infra/staging/10-noindex.sh
          NGINX_CONF="$RUNNER_TEMP/nginx.conf" sh infra/staging/10-noindex.sh
          # one header in the server block, plus one in every location that sets its own add_header (idempotent on a second run)
          test "$(grep -c 'X-Robots-Tag' "$RUNNER_TEMP/nginx.conf")" -eq "$(( $(grep -c 'add_header Cache-Control' "$RUNNER_TEMP/nginx.conf") + 1 ))"

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: customer/miniapp/Dockerfile
          failure-threshold: error

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: partner/web/Dockerfile
          failure-threshold: error

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: platform/admin/Dockerfile
          failure-threshold: error

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: infra/backup/Dockerfile
          failure-threshold: error

      # The build itself fails if redis/uv do not load (backend/Dockerfile); then check Reverb really gets the libuv loop
      - name: Backend image has ext-uv and Reverb uses it
        run: |
          docker build -t rizqim-backend:ci backend
          docker run --rm --entrypoint php rizqim-backend:ci -m | grep -qx uv
          test "$(docker run --rm --entrypoint php rizqim-backend:ci -r 'require "vendor/autoload.php"; echo get_class(React\EventLoop\Loop::get());')" = 'React\EventLoop\ExtUvLoop'

      # Wave M1: the three php-fpm pools and nginx's routing/limits load in the real image (defaults and an override)
      - name: Backend image php-fpm pools and nginx config are valid
        run: |
          docker run --rm --entrypoint rizqim-pools rizqim-backend:ci check
          docker run --rm --entrypoint sh -e FPM_MARKET_CHILDREN=2 rizqim-backend:ci -c 'rizqim-pools check && grep -q "rizqim_market_all 8;" /etc/nginx/rizqim-pools-limits.conf && grep -q "rizqim_market_client 2;" /etc/nginx/rizqim-pools-limits.conf'
          docker run --rm --entrypoint rizqim-pools -e DB_POOLER=pgbouncer -e PGBOUNCER_POOL_SIZE=12 rizqim-backend:ci check
          # Fail closed (M1 review R2-6): a bad value, one client able to fill the market pool, more workers than
          # PgBouncer connections, TLS to the pooler: the entrypoint stops before supervisord starts anything
          for bad in FPM_MARKET_CHILDREN=x NGINX_MARKET_CONN_PER_CLIENT=10 NGINX_MARKET_BURST=0 DB_SSLMODE=require PGBOUNCER_POOL_SIZE=11; do
            rc=0; timeout 60 docker run --rm -e "$bad" -e DB_POOLER=pgbouncer rizqim-backend:ci supervisord -c /etc/supervisor/conf.d/supervisord.conf 2> /tmp/err.txt || rc=$?
            if [ "$rc" != 1 ] || ! grep -q '^pools.sh: ' /tmp/err.txt; then echo "not refused at start: $bad (exit $rc)" >&2; cat /tmp/err.txt >&2; exit 1; fi
          done
          # Bounded wait for the database: exits 1 with the reason instead of hanging
          rc=0; timeout 60 docker run --rm -e DB_HOST=127.0.0.1 -e DB_PORT=1 -e STARTUP_WAIT_SECONDS=3 rizqim-backend:ci php -v 2> /tmp/err.txt || rc=$?
          test "$rc" = 1 && grep -q 'Postgres (127.0.0.1:1)' /tmp/err.txt

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: infra/pgbouncer/Dockerfile
          failure-threshold: error

      # Wave M1: the pooler php-fpm connects through (transaction mode); the entrypoint writes a config PgBouncer accepts
      - name: PgBouncer image builds and its generated config loads
        run: |
          docker build -t rizqim-pgbouncer:ci infra/pgbouncer
          docker run --rm --entrypoint sh -e DB_DATABASE=ci -e DB_USERNAME=ci -e DB_PASSWORD='p"w' rizqim-pgbouncer:ci -c \
            'sed "s/^exec pgbouncer /exit 0 #/" /usr/local/bin/pgbouncer-entrypoint.sh > /tmp/e.sh && sh /tmp/e.sh && grep -qx "pool_mode = transaction" /tmp/pgbouncer/pgbouncer.ini && grep -qx "\"ci\" \"p\"\"w\"" /tmp/pgbouncer/userlist.txt && { pgbouncer /tmp/pgbouncer/pgbouncer.ini & p=$!; sleep 2; kill -0 $p && kill $p; }'

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: infra/postgres/Dockerfile
          failure-threshold: error

      # Build context ./infra like docker-compose.yml (the PITR helpers come from infra/postgres)
      - name: Backup image has pg_dump 17, rclone and pgBackRest
        run: |
          docker build -f infra/backup/Dockerfile -t rizqim-backup:ci infra
          docker run --rm rizqim-backup:ci sh -c 'pg_dump --version | grep -q "(PostgreSQL) 17" && rclone version && pgbackrest version'

      # M3: the postgres image is the official server plus pgBackRest; both images must run the SAME pgBackRest
      # (archive-push in one container, backup/restore in the other), and with PITR_ENABLED unset the archive command
      # is a no-op (existing installs)
      - name: Postgres image (pgBackRest) matches the backup image
        run: |
          docker build -t rizqim-postgres:ci infra/postgres
          a=$(docker run --rm --entrypoint pgbackrest rizqim-postgres:ci version)
          b=$(docker run --rm --entrypoint pgbackrest rizqim-backup:ci version)
          echo "postgres: $a / backup: $b"
          test -n "$a" && test "$a" = "$b"
          docker run --rm --entrypoint sh rizqim-postgres:ci -c 'test "$(command -v postgres)" = /usr/local/bin/postgres && postgres --version | grep -q "(PostgreSQL) 17" && /usr/local/bin/pgbackrest-archive.sh pg_wal/000000010000000000000001'
          # A POSTGRES_DATA_VOLUME path without data: the entrypoint refuses instead of creating an empty database
          rc=0; docker run --rm -e RIZQIM_DATA_SOURCE=/srv/typo -e POSTGRES_PASSWORD=x rizqim-postgres:ci postgres > /tmp/ep.txt 2>&1 || rc=$?
          test "$rc" = 78 && grep -q YARATILMAYDI /tmp/ep.txt
          if timeout 120 docker run --rm --entrypoint sh -e PITR_ENABLED=1 -e PITR_ARCHIVE_ASYNC=n rizqim-postgres:ci -c '/usr/local/bin/pgbackrest-archive.sh pg_wal/000000010000000000000001' 2>/dev/null; then
            echo "archive command succeeded without a stanza: it must fail so Postgres keeps the WAL" >&2; exit 1
          fi

      # Built from the repository root like docker-compose.yml does; BuildKit takes the files from the Dockerfile's own
      # <Dockerfile>.dockerignore (an allow-list), not from the root .dockerignore
      - name: Mini App image builds
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build -f customer/miniapp/Dockerfile -t rizqim-miniapp:ci .
          docker run --rm --entrypoint nginx rizqim-miniapp:ci -t

      - name: Partner web image builds
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build -f partner/web/Dockerfile -t rizqim-partner-web:ci .
          docker run --rm --entrypoint test rizqim-partner-web:ci -f partner/web/server.js

      - name: Platform admin image builds
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build -f platform/admin/Dockerfile -t rizqim-platform-admin:ci .
          docker run --rm --entrypoint test rizqim-platform-admin:ci -f platform/admin/server.js

  # --- P1-11 TypeScript API client (runs when packages/ts or the OpenAPI spec changed, see the `apiclient` filter) --
  api-client:
    name: TS API client (generated types, typecheck, build)
    needs: changes
    if: needs.changes.outputs.apiclient == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ts/api-client
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/ts/api-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generated types match the OpenAPI spec
        run: |
          if ! npm run check:generated; then
            echo "::error file=packages/ts/api-client/src/schema.d.ts::TypeScript turlari packages/api-spec/openapi.json ga mos emas. Yangilang: cd packages/ts/api-client && npm run generate; so'ng commit qiling."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # --- P1-25 Partner web (runs when partner/web or packages/ts changed, see the `partnerweb` filter) ---------------
  partner-web:
    name: Partner web (lint, typecheck, tests, build)
    needs: changes
    if: needs.changes.outputs.partnerweb == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            partner/web/package-lock.json
            packages/ts/api-client/package-lock.json

      # partner/web links packages/ts/api-client (compiled to dist/, its "main") and packages/ts/ui (TypeScript source)
      - name: Build the API client
        working-directory: packages/ts/api-client
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        working-directory: partner/web
        run: npm ci

      - name: Lint
        working-directory: partner/web
        run: npm run lint

      - name: Typecheck
        working-directory: partner/web
        run: npm run typecheck

      # P2-31: the Playwright tests and their fake backend (partner/web/e2e) are TypeScript too
      - name: Typecheck (e2e)
        working-directory: partner/web
        run: npm run typecheck:e2e

      - name: Tests
        working-directory: partner/web
        run: npm test

      - name: Build
        working-directory: partner/web
        run: npm run build

  # --- P2-31 Partner web e2e (Playwright; runs with the partner-web filter) ---------------------------------------
  partner-web-e2e:
    name: Partner web e2e (Playwright, fake backend)
    needs: changes
    if: needs.changes.outputs.partnerweb == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: partner/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            partner/web/package-lock.json
            packages/ts/api-client/package-lock.json

      - name: Build the API client
        working-directory: packages/ts/api-client
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: npm ci

      # Playwright's own Chromium. The backend is a fake inside the test worker and Reverb is answered by the page's
      # WebSocket mock: nothing else is started. The test builds and starts the production panel itself (next build + start).
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: partner-web-playwright-report
          path: |
            partner/web/playwright-report
