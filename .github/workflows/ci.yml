            platform/admin/test-results
          retention-days: 7

  # --- P2-31 Cross-app e2e with the REAL stack (runs when e2estack paths changed, see the `e2estack` filter) -----
  # Postgres-backed Laravel (php artisan serve), Reverb, the partner web (next start), the Mini App (vite preview with
  # its /api proxy) and the RIZQIM control center (platform/admin, next start), driven by Playwright (e2e/stack): a customer's
  # order appears on the partner web board over the socket, the kitchen bumps its lines through the staff API with a PIN
  # session, the board and the manager's Mini App follow; and (P4-12) the first superadmin made by `rizqim:admin:create`
  # accepts the invite, sets up 2FA with TOTP codes the test computes, invites and re-roles a member behind step-up, and
  # finds it in the audit log and the search.
  # scripts/e2e-stack.sh does all of it (it is the same command to run locally).
  e2e-stack:
    name: Cross-app e2e (Laravel, Reverb, partner web, Mini App)
    needs: changes
    if: needs.changes.outputs.e2estack == 'true'
    runs-on: ubuntu-latest
    # The control center test waits for TOTP time steps (about two minutes in all)
    timeout-minutes: 30
    services:
      postgres:
        # Same major version as docker-compose.yml
        image: postgres:17
        env:
          POSTGRES_DB: rizqim_e2e
          POSTGRES_USER: rizqim
          POSTGRES_PASSWORD: rizqim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rizqim -d rizqim_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DB_DATABASE: rizqim_e2e
      E2E_DB_USERNAME: rizqim
      E2E_DB_PASSWORD: rizqim
      # Only the manual test-browser.js script of the Mini App uses puppeteer
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, intl, gd, bcmath, zip
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      # No backend/.env: the script passes the whole configuration as environment variables
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            partner/web/package-lock.json
            platform/admin/package-lock.json
            customer/miniapp/package-lock.json
            packages/ts/api-client/package-lock.json
            e2e/stack/package-lock.json

      - name: Build the API client
        working-directory: packages/ts/api-client
        run: |
          npm ci
          npm run build

      - name: Install the apps and the test
        run: |
          npm ci --prefix partner/web
          npm ci --prefix platform/admin
          npm ci --prefix customer/miniapp
          npm ci --prefix e2e/stack

      - name: Install Chromium
        working-directory: e2e/stack
        run: npx playwright install --with-deps chromium

      - name: Typecheck the test
        working-directory: e2e/stack
        run: npm run typecheck

      - name: Build, start the stack and run the tests
        run: scripts/e2e-stack.sh

      - name: Upload Playwright report and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stack-report
          # .run (the servers' logs) is a hidden folder
          include-hidden-files: true
          path: |
            e2e/stack/playwright-report
            e2e/stack/test-results
            e2e/stack/.run/*.log
          retention-days: 7

  # P3-33: the POS stack end-to-end test. The real Postgres-backed Laravel (php artisan serve) and Reverb, a choyxona seeded
  # by PosStackSeeder, driven only through pos_data like the cashier, waiter and kitchen apps drive them: the Thursday
  # evening (shift, booking with a deposit, ten rooms served by two waiters and the cashier, split bills, every tender,
  # SALE/ADVANCE/CREDIT/REFUND receipts, X and Z), a Telegram order accepted at the till, the real-time channel and a
  # version conflict. scripts/pos-e2e.sh does all of it (it is the same command to run locally).
  pos-stack-e2e:
    name: POS stack e2e (Laravel, Reverb, pos_data)
    needs: changes
    if: needs.changes.outputs.posstack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Same major version as docker-compose.yml
        image: postgres:17
        env:
          POSTGRES_DB: rizqim_pos_e2e
          POSTGRES_USER: rizqim
          POSTGRES_PASSWORD: rizqim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rizqim -d rizqim_pos_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Exact version, the same as in the flutter job
      FLUTTER_VERSION: 3.47.5
      POS_E2E_DB_DATABASE: rizqim_pos_e2e
      POS_E2E_DB_USERNAME: rizqim
      POS_E2E_DB_PASSWORD: rizqim
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, intl, gd, bcmath, zip
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      # No backend/.env: the script passes the whole configuration as environment variables
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format and analyze the test
        run: |
          dart format --output=none --set-exit-if-changed e2e/pos
          flutter analyze e2e/pos

      - name: Start the stack and run the tests
        run: scripts/pos-e2e.sh

      - name: Upload the servers' logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pos-stack-e2e-logs
          # .run (the servers' logs) is a hidden folder
          include-hidden-files: true
          path: |
            e2e/pos/.run/*.log
          retention-days: 7

  # --- M3 PITR drill (runs when the pitr paths changed, see the `pitr` filter) -------------------------------------
  # The production postgres and backup services (docker-compose.yml, images built from infra/postgres and infra/backup)
  # with MinIO over TLS as the S3 repository (infra/ci/docker-compose.pitr.yml): the daemon's stanza-create, check and
  # first full backup; batches A / full backup / B / T / C; scripts/restore-drill.sh --target-time T restores into a new
  # directory inside the backup container and must find A and B but not C; then the archive target goes down and comes
  # back; then the switch-over rehearsal: the copy at T is made the live database by scripts/pitr-switch.sh (A and B
  # only), switched back (--back), and a second drill proves the PITR chain survived it. db:restore-smoke must pass on
  # the restored copy. Then the review cases: a WAL gap from a spool overflow is detected and healed by a full backup
  # (R2-1), a missing POSTGRES_DATA_VOLUME path is refused (R2-5), a pending or broken copy never becomes live and a
  # failed switch rolls back (R2-3), a second switch needs --back/--finalize (R2-6), two switch-overs get new timelines
  # whose history reaches the repository (R2-4) and a failing cleanup after --back suspends expire (R2-2).
  # RESTORE_SECONDS, RECOVERY_POINT and DATA_LOSS_SECONDS go to the step summary. scripts/pitr-ci.sh does all of it
  # (scripts/pitr-ci.sh --local runs the same steps without Docker). No secrets: every credential is generated per run.
  pitr-drill:
    name: PITR drill (pgBackRest, compose topology)
    needs: changes
    if: needs.changes.outputs.pitr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, intl, gd, bcmath, zip
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      # Migrations and the app smoke run from the runner against the containers (everything else by environment)
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Build, start, drill
        run: scripts/pitr-ci.sh

      - name: Collect the containers' logs
        if: failure()
        run: |
          mkdir -p pitr-ci-logs
          docker compose -f docker-compose.yml -f infra/ci/docker-compose.pitr.yml ps -a > pitr-ci-logs/ps.txt 2>&1 || true
          for s in postgres backup minio; do
            docker compose -f docker-compose.yml -f infra/ci/docker-compose.pitr.yml logs --no-color --timestamps "$s" > "pitr-ci-logs/$s.log" 2>&1 || true
          done
          docker compose -f docker-compose.yml -f infra/ci/docker-compose.pitr.yml exec -T backup sh -c 'ls -la /restore; tail -n 200 /restore/*.log' > pitr-ci-logs/restore.txt 2>&1 || true
          cp "${TMPDIR:-/tmp}"/pitr-ci-migrate.log pitr-ci-logs/ 2>/dev/null || true

      - name: Upload the containers' logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pitr-drill-logs
          path: pitr-ci-logs
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: scripts/pitr-ci.sh --down || true

  # --- P2-13 Staff package (runs when packages/ts/staff or what it builds on changed, see the `staffpkg` filter) ---
  staff-package:
    name: Staff package (lint, typecheck, tests)
    needs: changes
    if: needs.changes.outputs.staffpkg == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/ts/staff/package-lock.json
            packages/ts/api-client/package-lock.json

      # The package types its API layer from the generated client (compiled to dist/) and links packages/ts/ui (source)
      - name: Build the API client
        working-directory: packages/ts/api-client
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        working-directory: packages/ts/staff
        run: npm ci

      - name: Lint
        working-directory: packages/ts/staff
        run: npm run lint

      - name: Typecheck
        working-directory: packages/ts/staff
        run: npm run typecheck

      - name: Tests
        working-directory: packages/ts/staff
        run: npm test

  # --- P1-26 Flutter / Dart workspace (runs when a Dart path or the OpenAPI spec changed, see the `flutter` filter) --
  flutter:
    name: Flutter (format, analyze, tests, generated client)
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    env:
      # Exact version, the same as in packages/dart/README.md (Dart 3.13.4). Raise both together.
      FLUTTER_VERSION: 3.47.5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # One pubspec.lock at the repository root for every Dart package (pub workspace); it must be committed up to date
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # Packages without Flutter (rizqim_core, rizqim_api) run with `dart test`, the others with `flutter test`
      - name: Tests
        run: |
          set -e
          for dir in packages/dart/* pos/apps/* courier partner/mobile customer/mobile; do
            [ -f "$dir/pubspec.yaml" ] && [ -d "$dir/test" ] || continue
            echo "::group::$dir"
            if grep -q 'sdk: flutter' "$dir/pubspec.yaml"; then
              (cd "$dir" && flutter test)
            else
              (cd "$dir" && dart test)
            fi
            echo "::endgroup::"
          done

      # packages/dart/rizqim_api/lib/src/generated is committed; it must be what the spec generates
      - name: Generated API client is up to date
        run: |
          bash packages/dart/rizqim_api/tool/generate.sh
          if [ -n "$(git status --porcelain -- packages/dart/rizqim_api/lib)" ]; then
            git status --short -- packages/dart/rizqim_api/lib | head -20
            echo "::error file=packages/dart/rizqim_api/lib/src/generated::Dart klienti packages/api-spec/openapi.json ga mos emas. Yangilang: bash packages/dart/rizqim_api/tool/generate.sh; so'ng commit qiling."
            exit 1
          fi

  # --- P3-15: POS packages (pos_core, pos_hardware, pos_ui) ---------------------------------------------------------
  # P3-20: pos_data (Flutter-free, `dart test`: repositories against a fake HTTP layer and real backend fixtures) too.
  # Format and analyze of the whole workspace already run in the flutter job; this job runs the packages' own tests:
  # ESC/POS bytes, text snapshots of receipts (test/goldens/*.txt), the LAN printer emulator, the print queue and the
  # golden images of the touch components (Linux, same Flutter version as the images were made with).
  pos-packages:
    name: POS packages (analyze, tests)
    needs: changes
    if: needs.changes.outputs.pospkg == 'true'
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: 3.47.5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze pos/packages

      # pos_core has no Flutter (dart test); a missing text golden fails on CI instead of being written
      - name: Tests
        run: |
          set -e
          for dir in pos/packages/*; do
            [ -f "$dir/pubspec.yaml" ] && [ -d "$dir/test" ] || continue
            echo "::group::$dir"
            if grep -q 'sdk: flutter' "$dir/pubspec.yaml"; then
              (cd "$dir" && flutter test)
            else
              (cd "$dir" && dart test)
            fi
            echo "::endgroup::"
          done

  # --- P6 hardware: Android debug builds of the POS apps -------------------------------------------------------------
  # The pos_hardware Android plugin (Kotlin: Sunmi printer, Bluetooth SPP and USB OTG printers, the scanner broadcast,
  # the second-screen Presentation) cannot be compiled on the developers' machines without an Android SDK; this job
  # compiles it together with each app (a Kotlin or manifest error fails the build). No emulator and no device: the
  # behaviour on real hardware is checked with docs/HARDWARE_TEST.md.
  android-build:
    name: Android build (POS apps, debug APK)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: 3.47.5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # One ABI keeps it fast; the Kotlin and the manifests are the same for every ABI
      - name: Build debug APKs
        run: |
          set -e
          for app in cashier waiter kds customer_display; do
            echo "::group::$app"
            (cd "pos/apps/$app" && flutter build apk --debug --target-platform android-arm64)
            echo "::endgroup::"
          done

  # --- P6 Windows: Windows debug builds of the POS apps and the Windows-only tests ---------------------------------
  # There is no Windows machine in development: the Win32 code (the customer display's full-screen placement on the
  # second monitor in pos/apps/customer_display/windows/runner/customer_monitor.cpp) is compiled only here, and the
  # winspool.drv bindings (FfiRawSpooler: printer list, a write to a missing printer fails clearly) and the LAN hub's
  # sockets (bind on every interface, the UDP beacon, SO_REUSEADDR) run here on real Windows. Same paths as the
  # android-build job. No real printer: the behaviour with hardware is checked with docs/HARDWARE_TEST.md.
  windows-build:
    name: Windows build (POS apps, debug) and Windows tests
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      FLUTTER_VERSION: 3.47.5
    steps:
      # The text goldens (test/goldens/*.txt) compare byte for byte: no CRLF on checkout
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # pos_hardware: everything, including test/windows_test.dart's real-spooler group (skipped elsewhere);
      # pos_lan: the hub and client over real sockets, test/platform_bind_test.dart
      - name: Tests (pos_hardware, pos_lan)
        run: |
          set -e
          (cd pos/packages/pos_hardware && flutter test)
          (cd pos/packages/pos_lan && dart test)

      - name: Build Windows debug apps
        run: |
          set -e
          for app in cashier waiter kds customer_display; do
            echo "::group::$app"
            (cd "pos/apps/$app" && flutter build windows --debug)
            rm -rf "pos/apps/$app/build"
            echo "::endgroup::"
          done
