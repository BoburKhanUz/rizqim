name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which jobs below are needed: a job runs only when a path it depends on changed. A change to this workflow
  # file runs everything. Skipped jobs count as passed for branch protection (unlike a workflow-level `paths:` filter,
  # which would leave required checks pending). Add a filter here when a new app gets its own job.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      miniapp: ${{ steps.filter.outputs.miniapp }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            miniapp:
              - 'customer/miniapp/**'
              - '.github/workflows/ci.yml'

  backend-tests:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: rizqim
          POSTGRES_PASSWORD: rizqim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rizqim -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, intl, gd, bcmath, zip
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      # phpunit.xml switches cache/queue/session to array/sync, so the tests need no Redis
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^APP_ENV=.*/APP_ENV=testing/' \
            -e 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' \
            -e 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' \
            -e 's/^DB_PORT=.*/DB_PORT=5432/' \
            -e 's/^DB_DATABASE=.*/DB_DATABASE=testing/' \
            -e 's/^DB_USERNAME=.*/DB_USERNAME=rizqim/' \
            -e 's/^DB_PASSWORD=.*/DB_PASSWORD=rizqim/' \
            .env

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate APP_KEY
        run: php artisan key:generate --ansi

      - name: Run tests
        run: php artisan test

  backend-static-analysis:
    name: Backend static analysis (PHPStan)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, intl, gd, bcmath, zip
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      # Larastan boots the application (no database connection is made)
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i -e 's/^APP_ENV=.*/APP_ENV=testing/' .env

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=table

  frontend:
    name: Mini App (lint, tests, build)
    needs: changes
    if: needs.changes.outputs.miniapp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer/miniapp
    env:
      # Only the manual test-browser.js script uses puppeteer; CI never needs its Chrome download
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: customer/miniapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Mini App e2e (Playwright)
    needs: changes
    if: needs.changes.outputs.miniapp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer/miniapp
    env:
      # Only the manual test-browser.js script uses puppeteer; CI never needs its Chrome download
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: customer/miniapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Playwright's own Chromium; the API is mocked in the browser, so no backend is started
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            customer/miniapp/playwright-report
            customer/miniapp/test-results
          retention-days: 7
