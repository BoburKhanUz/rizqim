name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which jobs below are needed: a job runs only when a path it depends on changed. A change to this workflow
  # file runs everything. Skipped jobs count as passed for branch protection (unlike a workflow-level `paths:` filter,
  # which would leave required checks pending). Add a filter here when a new app gets its own job.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      miniapp: ${{ steps.filter.outputs.miniapp }}
      infra: ${{ steps.filter.outputs.infra }}
      apiclient: ${{ steps.filter.outputs.apiclient }}
      partnerweb: ${{ steps.filter.outputs.partnerweb }}
      staffpkg: ${{ steps.filter.outputs.staffpkg }}
      flutter: ${{ steps.filter.outputs.flutter }}
      e2estack: ${{ steps.filter.outputs.e2estack }}
      # P3-15: POS packages (pos-packages job)
      pospkg: ${{ steps.filter.outputs.pospkg }}
      # P3-33: the POS stack end-to-end test (pos-stack-e2e job)
      posstack: ${{ steps.filter.outputs.posstack }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              # P1-11: the committed OpenAPI spec is checked against the code in backend-tests
              - 'packages/api-spec/**'
              - '.github/workflows/ci.yml'
            miniapp:
              - 'customer/miniapp/**'
              # P1-25: the design system the Mini App links from packages/ts/ui
              - 'packages/ts/ui/**'
              # P2-13: the staff screens' shared package and the API client it is built on
              - 'packages/ts/staff/**'
              - 'packages/ts/api-client/**'
              - '.github/workflows/ci.yml'
            # P1-11: TypeScript packages and the spec their API client is generated from (api-client job)
            apiclient:
              - 'packages/ts/**'
              - 'packages/api-spec/**'
              - '.github/workflows/ci.yml'
            # P1-13: compose files, images and shell scripts (infra job at the end of this file)
            infra:
              - 'docker-compose*.yml'
              - '.env*.example'
              - 'backend/Dockerfile'
              - 'backend/docker/**'
              # P2-33: the backend image installs composer.lock and dumps the optimized autoloader over the app code, and
              # the Reverb/ext-uv check runs in it: a dependency or app change can break the image build
              - 'backend/composer.json'
              - 'backend/composer.lock'
              - 'backend/.dockerignore'
              - 'backend/app/**'
              - 'backend/bootstrap/**'
              - 'backend/config/**'
              - 'backend/routes/**'
              - 'backend/database/**'
              - 'scripts/**'
              - 'infra/**'
              # The Mini App and partner web images are built here from the repository root: any change to the apps or
              # the TypeScript packages they link (packages/ts) can break the image build (lockfiles, file: links, build)
              - 'customer/miniapp/**'
              - 'partner/web/**'
              - 'packages/ts/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            # P1-25: the partner web (partner/web) and the TypeScript packages it links (packages/ts: ui, api-client)
            partnerweb:
              - 'partner/web/**'
              - 'packages/ts/**'
              - '.github/workflows/ci.yml'
            # P2-13: the shared staff package (packages/ts/staff) and what it is built on (staff-package job)
            staffpkg:
              - 'packages/ts/staff/**'
              - 'packages/ts/ui/**'
              - 'packages/ts/api-client/**'
              - 'packages/api-spec/**'
              - '.github/workflows/ci.yml'
            # P1-26: the Dart workspace (pubspec.yaml at the root), the Flutter apps, and the spec the Dart client is
            # generated from (flutter job at the end of this file)
            flutter:
              - 'packages/dart/**'
              - 'packages/api-spec/**'
              - 'pos/**'
              - 'courier/**'
              - 'partner/mobile/**'
              - 'customer/mobile/**'
              - 'pubspec*'
              - 'analysis_options.yaml'
              - '.github/workflows/ci.yml'
            # P3-15: the POS packages (pos/packages/*) and the shared Dart packages they build on (pos-packages job)
            pospkg:
              - 'pos/packages/**'
              - 'packages/dart/rizqim_core/**'
              - 'packages/dart/rizqim_ui/**'
              # P3-20: pos_data is built on the API client
              - 'packages/dart/rizqim_api/**'
              - 'pubspec*'
              - 'analysis_options.yaml'
              - '.github/workflows/ci.yml'
            # P2-31: the cross-app end-to-end test against the real stack (e2e-stack job): the backend (and the spec its clients
            # are generated from), both web apps, the TypeScript packages and the test itself
            e2estack:
              - 'backend/**'
              - 'packages/api-spec/**'
              - 'partner/web/**'
              - 'customer/miniapp/**'
              - 'packages/ts/**'
              - 'e2e/**'
              - 'scripts/e2e-stack.sh'
              - '.github/workflows/ci.yml'
            # P3-33: the POS stack end-to-end test against the real backend (pos-stack-e2e job): the backend, the POS packages
            # and the API client they are built on, the test and its script
            posstack:
              - 'backend/**'
              - 'pos/packages/**'
              - 'packages/dart/rizqim_api/**'
              - 'e2e/pos/**'
              - 'scripts/pos-e2e.sh'
              - 'pubspec*'
              - '.github/workflows/ci.yml'

  backend-tests:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Same major version as docker-compose.yml (postgres:17-alpine) and the backup image (infra/backup/Dockerfile)
        image: postgres:17
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: rizqim
          POSTGRES_PASSWORD: rizqim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rizqim -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, intl, gd, bcmath, zip
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      # phpunit.xml switches cache/queue/session to array/sync, so the tests need no Redis
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^APP_ENV=.*/APP_ENV=testing/' \
            -e 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' \
            -e 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' \
            -e 's/^DB_PORT=.*/DB_PORT=5432/' \
            -e 's/^DB_DATABASE=.*/DB_DATABASE=testing/' \
            -e 's/^DB_USERNAME=.*/DB_USERNAME=rizqim/' \
            -e 's/^DB_PASSWORD=.*/DB_PASSWORD=rizqim/' \
            .env

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate APP_KEY
        run: php artisan key:generate --ansi

      - name: Run tests
        run: php artisan test

      # P1-11: packages/api-spec/openapi.json must be what the code generates (model schemas come from the migrated
      # database, hence the migrate)
      - name: OpenAPI spec is up to date
        run: |
          php artisan migrate --force --no-interaction
          if ! php artisan api-spec:export --check; then
            echo "::error file=packages/api-spec/openapi.json::OpenAPI spetsifikatsiyasi koddan orqada. Yangilang: cd backend && php artisan migrate && php artisan api-spec:export; cd packages/ts/api-client && npm run generate; so'ng commit qiling."
            exit 1
          fi

  backend-static-analysis:
    name: Backend static analysis (PHPStan)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, intl, gd, bcmath, zip
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      # Larastan boots the application (no database connection is made)
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i -e 's/^APP_ENV=.*/APP_ENV=testing/' .env

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=table

  frontend:
    name: Mini App (lint, tests, build)
    needs: changes
    if: needs.changes.outputs.miniapp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer/miniapp
    env:
      # Only the manual test-browser.js script uses puppeteer; CI never needs its Chrome download
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            customer/miniapp/package-lock.json
            packages/ts/api-client/package-lock.json

      # P2-13: the Mini App links packages/ts/api-client (compiled to dist/, its "main") and packages/ts/staff (source)
      - name: Build the API client
        working-directory: packages/ts/api-client
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Mini App e2e (Playwright)
    needs: changes
    if: needs.changes.outputs.miniapp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer/miniapp
    env:
      # Only the manual test-browser.js script uses puppeteer; CI never needs its Chrome download
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            customer/miniapp/package-lock.json
            packages/ts/api-client/package-lock.json

      # P2-13: the Mini App links packages/ts/api-client (compiled to dist/, its "main") and packages/ts/staff (source)
      - name: Build the API client
        working-directory: packages/ts/api-client
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: npm ci

      # Playwright's own Chromium; the API is mocked in the browser, so no backend is started
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            customer/miniapp/playwright-report
            customer/miniapp/test-results
          retention-days: 7

  # --- P1-13 infra checks (runs only when an infra path changed, see the `infra` filter above) ---------------------
  infra:
    name: Infra (compose, shellcheck, images)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # compose reads env_file ./backend/.env, so it must exist even for `config`
      - name: Compose files are valid (production and staging)
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.staging.yml config -q
          cp .env.staging.example .env
          cp backend/.env.staging.example backend/.env
          docker compose config -q

      - name: Shellcheck
        run: |
          shellcheck scripts/*.sh backend/docker/entrypoint.sh infra/staging/*.sh

      # The script edits the Mini App nginx config at container start; fail here if that config changes shape
      - name: Staging noindex script still matches the Mini App nginx config
        run: |
          cp customer/miniapp/docker/nginx.conf "$RUNNER_TEMP/nginx.conf"
          NGINX_CONF="$RUNNER_TEMP/nginx.conf" sh infra/staging/10-noindex.sh
          NGINX_CONF="$RUNNER_TEMP/nginx.conf" sh infra/staging/10-noindex.sh
          # one header in the server block, plus one in every location that sets its own add_header (idempotent on a second run)
          test "$(grep -c 'X-Robots-Tag' "$RUNNER_TEMP/nginx.conf")" -eq "$(( $(grep -c 'add_header Cache-Control' "$RUNNER_TEMP/nginx.conf") + 1 ))"

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: customer/miniapp/Dockerfile
          failure-threshold: error

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: partner/web/Dockerfile
          failure-threshold: error

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: infra/backup/Dockerfile
          failure-threshold: error

      # The build itself fails if redis/uv do not load (backend/Dockerfile); then check Reverb really gets the libuv loop
      - name: Backend image has ext-uv and Reverb uses it
        run: |
          docker build -t rizqim-backend:ci backend
          docker run --rm --entrypoint php rizqim-backend:ci -m | grep -qx uv
          test "$(docker run --rm --entrypoint php rizqim-backend:ci -r 'require "vendor/autoload.php"; echo get_class(React\EventLoop\Loop::get());')" = 'React\EventLoop\ExtUvLoop'

      - name: Backup image has pg_dump 17 and rclone
        run: |
          docker build -t rizqim-backup:ci infra/backup
          docker run --rm rizqim-backup:ci sh -c 'pg_dump --version | grep -q "(PostgreSQL) 17" && rclone version'

      # Built from the repository root like docker-compose.yml does; BuildKit takes the files from the Dockerfile's own
      # <Dockerfile>.dockerignore (an allow-list), not from the root .dockerignore
      - name: Mini App image builds
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build -f customer/miniapp/Dockerfile -t rizqim-miniapp:ci .
          docker run --rm --entrypoint nginx rizqim-miniapp:ci -t

      - name: Partner web image builds
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build -f partner/web/Dockerfile -t rizqim-partner-web:ci .
          docker run --rm --entrypoint test rizqim-partner-web:ci -f partner/web/server.js

  # --- P1-11 TypeScript API client (runs when packages/ts or the OpenAPI spec changed, see the `apiclient` filter) --
  api-client:
    name: TS API client (generated types, typecheck, build)
    needs: changes
    if: needs.changes.outputs.apiclient == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ts/api-client
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/ts/api-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generated types match the OpenAPI spec
        run: |
          if ! npm run check:generated; then
            echo "::error file=packages/ts/api-client/src/schema.d.ts::TypeScript turlari packages/api-spec/openapi.json ga mos emas. Yangilang: cd packages/ts/api-client && npm run generate; so'ng commit qiling."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # --- P1-25 Partner web (runs when partner/web or packages/ts changed, see the `partnerweb` filter) ---------------
  partner-web:
    name: Partner web (lint, typecheck, tests, build)
    needs: changes
    if: needs.changes.outputs.partnerweb == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            partner/web/package-lock.json
            packages/ts/api-client/package-lock.json

      # partner/web links packages/ts/api-client (compiled to dist/, its "main") and packages/ts/ui (TypeScript source)
      - name: Build the API client
        working-directory: packages/ts/api-client
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        working-directory: partner/web
        run: npm ci

      - name: Lint
        working-directory: partner/web
        run: npm run lint

      - name: Typecheck
        working-directory: partner/web
        run: npm run typecheck

      # P2-31: the Playwright tests and their fake backend (partner/web/e2e) are TypeScript too
      - name: Typecheck (e2e)
        working-directory: partner/web
        run: npm run typecheck:e2e

      - name: Tests
        working-directory: partner/web
        run: npm test

      - name: Build
        working-directory: partner/web
        run: npm run build

  # --- P2-31 Partner web e2e (Playwright; runs with the partner-web filter) ---------------------------------------
  partner-web-e2e:
    name: Partner web e2e (Playwright, fake backend)
    needs: changes
    if: needs.changes.outputs.partnerweb == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: partner/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            partner/web/package-lock.json
            packages/ts/api-client/package-lock.json

      - name: Build the API client
        working-directory: packages/ts/api-client
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: npm ci

      # Playwright's own Chromium. The backend is a fake inside the test worker and Reverb is answered by the page's
      # WebSocket mock: nothing else is started. The test builds and starts the production panel itself (next build + start).
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: partner-web-playwright-report
          path: |
            partner/web/playwright-report
            partner/web/test-results
          retention-days: 7

  # --- P2-31 Cross-app e2e with the REAL stack (runs when e2estack paths changed, see the `e2estack` filter) -----
  # Postgres-backed Laravel (php artisan serve), Reverb, the partner web (next start) and the Mini App (vite preview with
  # its /api proxy), driven by Playwright (e2e/stack): a customer's order appears on the partner web board over the socket,
  # the kitchen bumps its lines through the staff API with a PIN session, the board and the manager's Mini App follow.
  # scripts/e2e-stack.sh does all of it (it is the same command to run locally).
  e2e-stack:
    name: Cross-app e2e (Laravel, Reverb, partner web, Mini App)
    needs: changes
    if: needs.changes.outputs.e2estack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Same major version as docker-compose.yml
        image: postgres:17
        env:
          POSTGRES_DB: rizqim_e2e
          POSTGRES_USER: rizqim
          POSTGRES_PASSWORD: rizqim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rizqim -d rizqim_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DB_DATABASE: rizqim_e2e
      E2E_DB_USERNAME: rizqim
      E2E_DB_PASSWORD: rizqim
      # Only the manual test-browser.js script of the Mini App uses puppeteer
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, intl, gd, bcmath, zip
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      # No backend/.env: the script passes the whole configuration as environment variables
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            partner/web/package-lock.json
            customer/miniapp/package-lock.json
            packages/ts/api-client/package-lock.json
            e2e/stack/package-lock.json

      - name: Build the API client
        working-directory: packages/ts/api-client
        run: |
          npm ci
          npm run build

      - name: Install the apps and the test
        run: |
          npm ci --prefix partner/web
          npm ci --prefix customer/miniapp
          npm ci --prefix e2e/stack

      - name: Install Chromium
        working-directory: e2e/stack
        run: npx playwright install --with-deps chromium

      - name: Typecheck the test
        working-directory: e2e/stack
        run: npm run typecheck

      - name: Build, start the stack and run the tests
        run: scripts/e2e-stack.sh

      - name: Upload Playwright report and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stack-report
          # .run (the servers' logs) is a hidden folder
          include-hidden-files: true
          path: |
            e2e/stack/playwright-report
            e2e/stack/test-results
            e2e/stack/.run/*.log
          retention-days: 7

  # P3-33: the POS stack end-to-end test. The real Postgres-backed Laravel (php artisan serve) and Reverb, a choyxona seeded
  # by PosStackSeeder, driven only through pos_data like the cashier, waiter and kitchen apps drive them: the Thursday
  # evening (shift, booking with a deposit, ten rooms served by two waiters and the cashier, split bills, every tender,
  # SALE/ADVANCE/CREDIT/REFUND receipts, X and Z), a Telegram order accepted at the till, the real-time channel and a
  # version conflict. scripts/pos-e2e.sh does all of it (it is the same command to run locally).
  pos-stack-e2e:
    name: POS stack e2e (Laravel, Reverb, pos_data)
    needs: changes
    if: needs.changes.outputs.posstack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Same major version as docker-compose.yml
        image: postgres:17
        env:
          POSTGRES_DB: rizqim_pos_e2e
          POSTGRES_USER: rizqim
          POSTGRES_PASSWORD: rizqim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rizqim -d rizqim_pos_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Exact version, the same as in the flutter job
      FLUTTER_VERSION: 3.47.5
      POS_E2E_DB_DATABASE: rizqim_pos_e2e
      POS_E2E_DB_USERNAME: rizqim
      POS_E2E_DB_PASSWORD: rizqim
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, intl, gd, bcmath, zip
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      # No backend/.env: the script passes the whole configuration as environment variables
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format and analyze the test
        run: |
          dart format --output=none --set-exit-if-changed e2e/pos
          flutter analyze e2e/pos

      - name: Start the stack and run the tests
        run: scripts/pos-e2e.sh

      - name: Upload the servers' logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pos-stack-e2e-logs
          # .run (the servers' logs) is a hidden folder
          include-hidden-files: true
          path: |
            e2e/pos/.run/*.log
          retention-days: 7

  # --- P2-13 Staff package (runs when packages/ts/staff or what it builds on changed, see the `staffpkg` filter) ---
  staff-package:
    name: Staff package (lint, typecheck, tests)
    needs: changes
    if: needs.changes.outputs.staffpkg == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/ts/staff/package-lock.json
            packages/ts/api-client/package-lock.json

      # The package types its API layer from the generated client (compiled to dist/) and links packages/ts/ui (source)
      - name: Build the API client
        working-directory: packages/ts/api-client
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        working-directory: packages/ts/staff
        run: npm ci

      - name: Lint
        working-directory: packages/ts/staff
        run: npm run lint

      - name: Typecheck
        working-directory: packages/ts/staff
        run: npm run typecheck

      - name: Tests
        working-directory: packages/ts/staff
        run: npm test

  # --- P1-26 Flutter / Dart workspace (runs when a Dart path or the OpenAPI spec changed, see the `flutter` filter) --
  flutter:
    name: Flutter (format, analyze, tests, generated client)
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    env:
      # Exact version, the same as in packages/dart/README.md (Dart 3.13.4). Raise both together.
      FLUTTER_VERSION: 3.47.5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # One pubspec.lock at the repository root for every Dart package (pub workspace); it must be committed up to date
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # Packages without Flutter (rizqim_core, rizqim_api) run with `dart test`, the others with `flutter test`
      - name: Tests
        run: |
          set -e
          for dir in packages/dart/* pos/apps/* courier partner/mobile customer/mobile; do
            [ -f "$dir/pubspec.yaml" ] && [ -d "$dir/test" ] || continue
            echo "::group::$dir"
            if grep -q 'sdk: flutter' "$dir/pubspec.yaml"; then
              (cd "$dir" && flutter test)
            else
              (cd "$dir" && dart test)
            fi
            echo "::endgroup::"
          done

      # packages/dart/rizqim_api/lib/src/generated is committed; it must be what the spec generates
      - name: Generated API client is up to date
        run: |
          bash packages/dart/rizqim_api/tool/generate.sh
          if [ -n "$(git status --porcelain -- packages/dart/rizqim_api/lib)" ]; then
            git status --short -- packages/dart/rizqim_api/lib | head -20
            echo "::error file=packages/dart/rizqim_api/lib/src/generated::Dart klienti packages/api-spec/openapi.json ga mos emas. Yangilang: bash packages/dart/rizqim_api/tool/generate.sh; so'ng commit qiling."
            exit 1
          fi

  # --- P3-15: POS packages (pos_core, pos_hardware, pos_ui) ---------------------------------------------------------
  # P3-20: pos_data (Flutter-free, `dart test`: repositories against a fake HTTP layer and real backend fixtures) too.
  # Format and analyze of the whole workspace already run in the flutter job; this job runs the packages' own tests:
  # ESC/POS bytes, text snapshots of receipts (test/goldens/*.txt), the LAN printer emulator, the print queue and the
  # golden images of the touch components (Linux, same Flutter version as the images were made with).
  pos-packages:
    name: POS packages (analyze, tests)
    needs: changes
    if: needs.changes.outputs.pospkg == 'true'
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: 3.47.5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze pos/packages

      # pos_core has no Flutter (dart test); a missing text golden fails on CI instead of being written
      - name: Tests
        run: |
          set -e
          for dir in pos/packages/*; do
            [ -f "$dir/pubspec.yaml" ] && [ -d "$dir/test" ] || continue
            echo "::group::$dir"
            if grep -q 'sdk: flutter' "$dir/pubspec.yaml"; then
              (cd "$dir" && flutter test)
            else
              (cd "$dir" && dart test)
            fi
            echo "::endgroup::"
          done
