  # --- P4-12 RIZQIM control center (runs when platform/admin or packages/ts changed, see the `platformadmin` filter) ---
  platform-admin:
    name: Platform admin (lint, typecheck, tests, build)
    needs: changes
    if: needs.changes.outputs.platformadmin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
