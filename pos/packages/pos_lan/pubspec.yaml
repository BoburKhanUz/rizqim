name: pos_lan
description: Rizqim POS lokal ko'prigi (P6) — internet uzilsa asosiy kassa (markaz) Wi-Fi orqali ofitsiant, KDS va mijoz ekraniga xizmat qiladi; shifrlangan va HMAC-SHA256 bilan imzolangan kadrlar, beacon, oflayn grant, amallarni markaz navbatiga yozish. Flutter'ga bog'liq emas.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  # HMAC-SHA256 (already in the workspace lock; a direct dependency of this package only)
  crypto: ^3.0.6
  pos_core:
    path: ../pos_core
  pos_data:
    path: ../pos_data
  pos_sync:
    path: ../pos_sync

dev_dependencies:
  dio: ^5.9.0
  flutter_lints: ^6.0.0
  rizqim_api:
    path: ../../../packages/dart/rizqim_api
  test: ^1.25.0
