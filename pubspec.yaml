# Dart workspace (pub workspaces, Dart >= 3.6): one pubspec.lock and one `dart pub get` for every Dart package.
# New Flutter apps (cashier, waiter, customer_display, courier, partner/mobile, customer/mobile) are added to the
# list below as they appear. See packages/dart/README.md.
name: rizqim_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/dart/rizqim_core
  - packages/dart/rizqim_api
  - packages/dart/rizqim_ui
  - pos/apps/kds
  # P3-15: POS packages
  - pos/packages/pos_core
  - pos/packages/pos_hardware
  - pos/packages/pos_ui
  # P3-20: POS data layer and the cashier and waiter app shells
  - pos/packages/pos_data
  - pos/apps/cashier
  - pos/apps/waiter
  # P3-31: offline limited mode (durable queue and sync)
  - pos/packages/pos_sync
  # P3-33: the POS stack end-to-end test (real Laravel + Reverb through pos_data; scripts/pos-e2e.sh)
  - e2e/pos
