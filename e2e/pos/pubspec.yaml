name: e2e_pos
description: Rizqim POS stack end-to-end test - the real Laravel API and Reverb driven through pos_data (choyxona evening, Telegram order, real-time, conflicts, customer display, osh markazi lunch rush, fast food lunch peak, the internet outage over the local bridge, the stolovaya lunch with corporate talons, QR payments and gift certificates).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dev_dependencies:
  dio: ^5.9.0
  flutter_lints: ^6.0.0
  pos_core:
    path: ../../pos/packages/pos_core
  pos_data:
    path: ../../pos/packages/pos_data
  # P6-39: the TSPL label printer emulator and decoder (the pure-Dart part: the tests never load its Flutter code)
  pos_hardware:
    path: ../../pos/packages/pos_hardware
  # P6 stage B: the local bridge (the till's LanHub, the hall devices' LanClient) of the "internet uzildi" drill
  pos_lan:
    path: ../../pos/packages/pos_lan
  rizqim_api:
    path: ../../packages/dart/rizqim_api
  test: ^1.25.0
