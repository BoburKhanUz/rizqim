# Shared by every Dart package of the workspace (each package includes it from its own analysis_options.yaml).
# flutter_lints is lints/recommended plus the Flutter rules; pure Dart packages use it too.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    todo: ignore
  exclude:
    # *.g.dart is build_runner output; lint noise in generated sources is silenced by their own header, but real
    # errors in lib/src/generated still show (the generated client must compile)
    - '**/*.g.dart'

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - require_trailing_commas
    - unawaited_futures
    - use_super_parameters
