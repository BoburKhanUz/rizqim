# The scheme the client used: an outer proxy that terminates TLS in front of this container already says it in
# X-Forwarded-Proto, which is passed on as it is; only a request without one gets this server's own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's default is 1m, which rejected every photo upload through /api/ (product images, store logos, banners).
    # The API accepts an image up to 5 MB; 10m leaves room for the multipart overhead. The next hops are looser
    # (backend/docker/nginx.conf 16m, backend/docker/php.ini post_max_size 16M), so this is the limit users meet.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS (Docker Compose network only). It is used because the backend address below sits in a
    # variable: nginx then looks "backend" up while serving requests (kept for 5 s) instead of once at startup.
    # A plain `proxy_pass http://backend:80/...` pins the IP found at startup, so after the backend container alone
    # is recreated (docker compose up -d --build backend) every /api/ and /storage/ request fails with 502 until
    # this container is restarted too. Starting no longer needs the backend to resolve either.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    set $backend_upstream http://backend:80;

    # Both proxied locations (inherited by them; the static ones do not proxy)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The entry document names the hashed bundles of ONE build: a copy a browser keeps across a deploy asks for
    # /assets/ files that no longer exist. no-cache = store it, but revalidate before every use (a cheap 304 while it
    # is unchanged). "/", the SPA routes (try_files above) and /index.html itself all end up in this location.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite puts a hash of the content in every file name under /assets/, so a URL never changes its content: cache it
    # for good. No `always`: a 404 for a chunk of an older build must not be cached.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ^~: the backend's paths win over the static-file rule below (an uploaded image ends in .jpg/.png too).
    # proxy_pass has no URI part, so the request URI goes to the backend exactly as the client sent it (/api/v1/... stays
    # /api/v1/...), query string included.
    location ^~ /api/ {
        proxy_pass $backend_upstream;
    }

    # Uploaded files (product images, store logos and banners): the API builds their URLs on this origin
    location ^~ /storage/ {
        proxy_pass $backend_upstream;
    }

    # Files copied from public/ as they are (favicon.svg, icons.svg): no hash in the name, so not cached for good
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }
}
