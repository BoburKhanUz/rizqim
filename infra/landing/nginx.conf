# rizqim.uz (docker-compose.yml `landing`): statik sahifalar + formaning ikki API chaqiruvi. Boshqa API yo'llari yopiq.
# Tashqi TLS proksi rizqim.uz (va www) ni LANDING_PORT ga yo'naltiradi.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    # Yo'naltirishlar (301) faqat yo'l bilan ketsin: tashqi TLS proksi orqasida ichki host:port chiqmasin
    absolute_redirect off;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # Docker DNS: backend manzili o'zgaruvchida, shuning uchun qayta yaratilgan konteyner ham topiladi (pos-site kabi)
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    set $backend_upstream http://backend:80;

    include /etc/nginx/security-headers.inc;
    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Ichki hujjatlar (masalan img/photos/README.md) tashqariga berilmaydi. Regex joylar tartib bilan tekshiriladi, shuning uchun birinchi turadi
    location ~* \.md$ {
        return 404;
    }

    # Sahifalar va ularning skriptlari deploy bilan o'zgaradi: saqlanadi, lekin har safar tekshiriladi
    location = / {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location ~ ^/(site\.config\.js|robots\.txt|sitemap\.xml)$ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ~ ^/(js|css|i18n)/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    # Rasmlar kam o'zgaradi
    location ~ ^/(img/|og\.png$|apple-touch-icon\.png$) {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    # O'z serverimizdagi shriftlar (OFL, fonts/OFL-*.txt): fayl nomi o'zgarmaydi, kam yangilanadi
    location ~ ^/fonts/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
    # Bosh sahifa faqat "/" da: /index.html toza manzilga yo'naltiriladi, /index topilmaydi
    location = /index.html {
        return 301 /;
    }
    location = /index {
        return 404;
    }
    # /hamkor, /maxfiylik, /shartlar -> .html (toza manzillar); .html bilan ochilsa toza manzilga yo'naltiriladi
    location ~ ^/(?<page>[a-z]+)\.html$ {
        return 301 /$page;
    }
    location ~ ^/(?<dir>hamkor|maxfiylik|shartlar)/$ {
        return 301 /$dir;
    }
    location / {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html =404;
    }
    location = /404.html {
        internal;
        include /etc/nginx/security-headers.inc;
    }

    # Faqat shu ikki chaqiruv backend'ga boradi, boshqa API yo'q
    location = /api/v1/store-applications {
        limit_except POST { deny all; }
        client_max_body_size 16k;
        include /etc/nginx/security-headers.inc;
        proxy_http_version 1.1;
        proxy_read_timeout 25s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-Id $request_id;
        proxy_pass $backend_upstream;
    }
    location = /api/v1/locations {
        limit_except GET HEAD { deny all; }
        include /etc/nginx/security-headers.inc;
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-Id $request_id;
        proxy_pass $backend_upstream;
    }
    location /api/ {
        return 404;
    }
}
