# pos.rizqim.uz (docker-compose.yml `pos-site`): the download page, the files and the one API call the page makes.
# One source of truth: the registry in the control centre (GET /api/v1/pos/releases); this site holds files and one page.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS: the backend address sits in a variable so nginx resolves it per request and survives a
    # recreated backend container (the same reason as customer/miniapp/docker/nginx.conf)
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    set $backend_upstream http://backend:80;

    add_header X-Content-Type-Options "nosniff" always;

    # The page and its script change with a deploy: store, but revalidate
    location = / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /app.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The app files: /files/<app>/<platform>/<file> (a volume, see docker-compose.yml). No directory listing.
    location /files/ {
        autoindex off;
        # An APK and a checksum file are not on nginx's default type list (a `types` block in a location replaces the
        # inherited list, so the default one is included again first)
        include /etc/nginx/mime.types;
        types {
            application/vnd.android.package-archive apk;
            text/plain                              sha256;
        }
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Only the public manifest reaches the backend, nothing else of the API
    location = /api/v1/pos/releases {
        limit_except GET HEAD { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-Id $request_id;
        proxy_pass $backend_upstream;
    }

    location / {
        return 404;
    }
}
